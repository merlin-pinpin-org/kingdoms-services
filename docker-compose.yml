services:
  kingdoms-bot:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - MONGO_URI=mongodb://kingdoms-mongo:27017
      - REDIS_URI=redis://kingdoms-redis:6379
      - DISCORD_TOKEN=${DISCORD_TOKEN:-}
      - BOT_ADMINS=${BOT_ADMINS:-}
      - CORE_URI=kingdoms-core:50051
    depends_on:
      - kingdoms-mongo
      - kingdoms-redis
      - kingdoms-core

  kingdoms-core:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - KINGDOMS_PROCESS=core
      - MONGO_URI=mongodb://kingdoms-mongo:27017
      - REDIS_URI=redis://kingdoms-redis:6379
      - CORE_GRPC_PORT=50051
    expose:
      - "50051"
    depends_on:
      - kingdoms-mongo
      - kingdoms-redis
  kingdoms-ext-librematch:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - KINGDOMS_PROCESS=ext-librematch
      - EXT_GRPC_PORT=50061
    expose:
      - "50061"
  kingdoms-ext-aoe2lobby:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - KINGDOMS_PROCESS=ext-aoe2lobby
      - EXT_GRPC_PORT=50062
    expose:
      - "50062"

  kingdoms-mongo:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  kingdoms-redis:
    image: redis:7.2
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mongo_data:
  redis_data:
