services:
  kingdoms-bot:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - MONGO_URI=mongodb://kingdoms-mongo:27017
      - REDIS_URI=redis://kingdoms-redis:6379
      - DISCORD_TOKEN=${DISCORD_TOKEN:-}
    depends_on:
      - kingdoms-mongo
      - kingdoms-redis

  kingdoms-mongo:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  kingdoms-redis:
    image: redis:7.2
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mongo_data:
  redis_data:
