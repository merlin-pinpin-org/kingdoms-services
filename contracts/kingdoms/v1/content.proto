syntax = "proto3";

package kingdoms.v1;

// Game content provider service (ext-aoe2techtree family): a content
// source process serves localized game catalog data (factions, maps) to
// svc-core. Content is immutable between game patches; the core caches it
// in Mongo/Redis and bot admins trigger a refresh on patch days. The
// upstream the ext process reads (vendored dataset, HTTP API, ...) is
// the provider's own concern — the core only ever sees this contract,
// so switching to another API source never touches the consumers.
service Content {
  // Declare the provider identity and its supported game/locale surface.
  rpc GetContentCapabilities(ContentCapabilitiesRequest) returns (ContentCapabilities);
  // Every faction key the source knows (catalog reconciliation).
  rpc ListFactions(ListFactionsRequest) returns (FactionList);
  // One faction's localized content (name + game-provided help summary).
  rpc GetFactionContent(FactionContentRequest) returns (LocalizedContent);
  // One map's localized content (name-only today).
  rpc GetMapContent(MapContentRequest) returns (LocalizedContent);

  // One map's full descriptor (the import flow): description, image,
  // licence-checked fields — the Liquipedia family of content sources.
  // The provider owns the raw data and its terms-of-use compliance.
  rpc GetMapSeed(MapSeedRequest) returns (MapSeedReply);
}

message MapSeedRequest {
  string game_key = 1;    // e.g. "aoe2" (the provider keys its wikis by game)
  string map_key = 2;     // the map name or page title the admin typed
}

message MapSeedReply {
  bool found = 1;              // false: no page under this name
  string name = 2;             // canonical display name
  string description = 3;
  string resource_url = 4;     // attribution/source link
  string image_url = 5;
  string icon_url = 6;
  string terrain = 7;
  string size = 8;
  string map_type = 9;
  bool licence_ok = 10;        // true: the image passed the licence guard
  string licence_note = 11;    // the refusal reason when licence_ok is false
}

message ContentCapabilitiesRequest {}

message ContentCapabilities {
  string provider_key = 1;   // e.g. "aoe2techtree"
  string game_key = 2;       // e.g. "aoe2"
  repeated string locales = 3; // supported content locales, e.g. "en", "fr"
}

message ListFactionsRequest {}

message FactionList {
  repeated string faction_keys = 1;
}

message FactionContentRequest {
  string faction_key = 1;     // provider-side faction/civ identifier
  string locale = 2;          // requested locale, empty = source default
}

message MapContentRequest {
  string map_key = 1;         // provider-side map identifier
  string locale = 2;
}

message LocalizedContent {
  string entity_id = 1;       // canonical platform entity id
  string locale = 2;          // locale actually served (fallback applied)
  string name = 3;            // localized display name
  string summary = 4;         // localized summary text, may be empty
  string source_url = 5;      // data source attribution link
  bool found = 6;             // false: the source does not know this key
  string image_url = 7;       // optional visual (e.g. the faction's crest), may be empty
}
