syntax = "proto3";

import "kingdoms/v1/game.proto";
import "kingdoms/v1/content.proto";

package kingdoms.v1;



// Game data service (direction développeur, architecture cible):
// one process per game (game-aoe2), the ONLY consumer of the external
// providers (ext-librematch, ext-aoe2lobby, ...) for that game. It owns
// the game domain tables (matches, players, stats), exploits the raw
// provider data, and serves the consolidated state to svc-core and the
// bot. svc-core never talks to the providers, and vice versa.
//
// The contract is game-generic: the game is a parameter, so a future
// game-aoe4 process serves the same contract with game_key = "aoe4".

// The content sync: "factions" (the civs catalog + content docs) or
// "maps" (the Liquipedia enrichment). The reply carries the counts, the
// newly created factions, or a FUNCTIONAL error the UI shows as-is
// (a provider is down, rate-limited, or not configured).
message SyncContentRequest {
  string game_key = 1;
  string what = 2;  // "factions" | "maps"
}

message SyncContentReply {
  bool ok = 1;
  string error = 2;  // the functional error, empty when ok
  map<string, int64> counts = 3;
  repeated string new_factions = 4;
}

// The last-completed times: one answer for the whole batch (the panel
// is immediate). Zero means no completed match yet.
message GetLastCompletedTimesRequest {
  string game_key = 1;
  repeated string profile_ids = 2;
}

message GetLastCompletedTimesReply {
  map<string, int64> times_ms = 1;  // profile_id -> epoch ms (0: none)
}

// One catalog operation: the op name (a GameDataService method), the
// kwargs as JSON. The reply carries the result as JSON, or a functional
// error with its kind (the caller re-raises the typed exception).
message GameDataCallRequest {
  string op = 1;
  string payload_json = 2;
}

message GameDataCallReply {
  bool ok = 1;
  string error_kind = 2;  // the exception class name ("" when ok)
  string error = 3;       // the functional message
  string result_json = 4;
}

service GameData {
  // Declare which games this service covers and per-game capabilities.
  rpc GetCoverage(CoverageRequest) returns (GameCoverage);

  // Server-stream the live dashboard state for a game: linked players,
  // their status (in_lobby/in_game), and the enriched match summary
  // (map, civilization, format, join/spectate links).
  rpc WatchDashboard(WatchGameDataRequest) returns (stream GameDashboard);

  // Server-stream player status transitions for a game (the generic
  // mod-notification feed): each transition carries the full match
  // summary so mods render rich notifications without extra calls.
  rpc WatchPlayerEvents(WatchGameDataRequest) returns (stream GamePlayerEvent);

  // Push the platform's enrolled profile ids for a game. The service
  // reconciles its providers' subscriptions in place (no teardown).
  rpc UpdateEnrollments(UpdateEnrollmentsRequest) returns (UpdateEnrollmentsResponse);
  // The content sync (civs, maps): the game service runs it against ITS
  // providers — the bot never touches a provider, it asks the service.
  rpc SyncContent(SyncContentRequest) returns (SyncContentReply);

  // The provider surfaces, PROXIED by the game service (rule 4: the
  // mods and the bot talk to the game service, never to an ext). The
  // wire messages are the Game contract's own — one shape, no copy.
  rpc GetProfileStats(kingdoms.v1.GetPlayerStatsRequest) returns (kingdoms.v1.PlayerStats);
  rpc GetMatchResult(kingdoms.v1.GetMatchResultRequest) returns (kingdoms.v1.MatchResult);
  rpc GetProviderCapabilities(kingdoms.v1.CapabilitiesRequest) returns (kingdoms.v1.Capabilities);
  // The profiles' most recent completed-match times (epoch ms) — the
  // game's OWN matches collection answers, never the caller's raw read.
  rpc GetLastCompletedTimes(GetLastCompletedTimesRequest) returns (GetLastCompletedTimesReply);
  // The map seed lookup (the import flow): the game service proxies its
  // liquipedia content provider — the Content contract's own wire.
  rpc GetMapSeed(kingdoms.v1.MapSeedRequest) returns (kingdoms.v1.MapSeedReply);
  // The catalog gateway: one op dispatch (rule 5 — the game's collections
  // answer from the owner's process). The payload/result are JSON; the
  // service's validation, audit and lifecycle logic stay THE logic.
  rpc Call(GameDataCallRequest) returns (GameDataCallReply);


  // The providers' health-test results for a game: the game service
  // probes its providers periodically (capabilities ping, live stream
  // liveness) and serves the last results per provider.
}

message CoverageRequest {}

message GameCoverage {
  repeated string game_keys = 1;  // e.g. ["aoe2"] for game-aoe2
  bool realtime = 2;              // at least one realtime provider wired
  bool degraded = 3;              // true: no provider reachable
}

message WatchGameDataRequest {
  string game_key = 1;      // e.g. "aoe2"
  int64 since = 2;          // ignore events older than this epoch-ms
}

message GameDashboard {
  repeated GamePlayerState players = 1;  // every known active player, sorted
  int64 generated_at = 2;     // epoch ms of this snapshot
  bool degraded = 3;          // true: provider-less, all states offline
}

message GamePlayerState {
  string user_id = 1;        // platform user id, empty when unknown
  string profile_id = 2;     // game profile id
  string state = 3;          // offline | in_lobby | in_game
  string match_ref = 4;     // opaque provider match id, empty when offline
  int64 since = 5;           // epoch ms of the last state change
  GameMatchSummary match = 6; // enriched match context, empty when offline
}

message GameMatchSummary {
  string match_ref = 1;
  string map_name = 2;       // human-readable map name
  string format = 3;         // e.g. "1v1", "2v2", "FFA" (from slots/teams)
  string status = 4;         // lobby | in_game
  int32 slots_taken = 5;
  int32 slots_total = 6;
  string host_name = 7;      // display name of the host, empty when unknown
  repeated GamePlayerSlot players = 8; // per-slot summary (civs, avatars, teams)
  string lobby_url = 9;      // aoe2lobby.com/j/<id> (lobby) — join page
  string spectate_url = 10;  // aoe2lobby.com/w/<id> (in game) — watch page
  string deep_link = 11;     // aoe2de:// join deep link when available
  string match_type = 12;    // the game mode label (RandomMap, FFA, ...)
}

message GamePlayerSlot {
  string profile_id = 1;
  string name = 2;            // in-game display name
  string civilization = 3;   // human-readable civ (via ws schema), raw id as fallback
  int32 team = 4;
  bool filled = 5;
  string avatar_url = 6;      // the player's steam avatar, may be empty
  string country = 7;        // country code, may be empty
}

message GamePlayerEvent {
  string game_key = 1;
  string profile_id = 2;
  string user_id = 3;         // platform user id, empty when unknown
  string old_status = 4;      // offline | in_lobby | in_game
  string new_status = 5;
  int64 occurred_at = 6;      // epoch ms
  GameMatchSummary match = 7; // enriched match context of the transition
}

message UpdateEnrollmentsRequest {
  string game_key = 1;        // the game the profiles belong to
  repeated string profile_ids = 2; // full current list (idempotent reconciliation)
  repeated string user_ids = 3;    // parallel to profile_ids: the platform user owning each profile
}

message UpdateEnrollmentsResponse {
  int32 subscribed = 1;   // total profile ids subscribed after reconciliation
  bool applied = 2;       // false: no realtime provider currently reachable
}


