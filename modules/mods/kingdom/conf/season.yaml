# Kingdoms season configuration override (admin data).
#
# Civilizations — Diplomatie V1 (cadastre-diplomatie-v1, Drasah
# 15/10/2026, source of truth: diplomatie-civs-conditions.md). EVERY
# declared civilization carries its official acquisition condition —
# the engine (DiplomacyService._condition_met) reads only these
# fields. The cadastre bonus texts of the maps are DISPLAY-only and
# may diverge. Keys match data/kingdoms/princesses.yaml so the
# marriage workflow can pick the bride names per civilization.

