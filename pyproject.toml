[project]
name = "kingdoms-services"
version = "0.1.0"
description = "Core bot, Discord implementation, shared utilities, and YAML configs for Kingdoms."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "discord.py>=2.7.1",
    "pymongo>=4.5.0",
    "pydantic>=2.5.0",
    "redis>=5.0.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "httpx>=0.26.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "grpcio>=1.62.0",
    "grpcio-status>=1.62.0",
    "websockets>=12.0",
]

[project.scripts]
kingdoms = "kingdoms.cli.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kingdoms"]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.6",
    "mypy>=1.8.0",
    "types-pyyaml>=6.0",
    "types-redis>=4.5.5",
    "simcord[pytest]>=2.1.0",
    "grpcio-tools>=1.62.0",
    "types-protobuf>=7.35.1.20260906",
    "types-grpcio>=1.84.0.20260928",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C", "D", "N", "UP", "S", "T", "Q", "RUF"]
ignore = ["D203", "D213", "D107", "S603"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101", "SLF"]
"src/kingdoms/rpc_generated/**" = ["D", "N", "E501", "I", "Q", "UP", "F401"]
"src/kingdoms/core/rpc/**" = ["N802"]
"scripts/**" = ["D", "S101", "S311", "T201"]
"src/kingdoms/discord/bot/main.py" = ["T201", "T203"]
"src/kingdoms/cli/**" = ["T201", "T203", "S603", "S607"]
"src/kingdoms/core/games/aoe2/seed_cli.py" = ["T201"]
"src/kingdoms/core/games/aoe2/seed_cli_yaml.py" = ["T201"]
