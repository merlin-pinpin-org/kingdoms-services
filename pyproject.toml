[project]
name = "kingdoms-services"
version = "0.1.0"
description = "Core bot, Discord implementation, shared utilities, and YAML configs for Kingdoms."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "discord.py>=2.7.1",
    "pymongo>=4.5.0",
    "pydantic>=2.5.0",
    "redis>=5.0.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "httpx>=0.26.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kingdoms"]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.6",
    "mypy>=1.8.0",
    "types-redis>=4.5.5",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C", "D", "N", "UP", "S", "T", "Q", "RUF"]
ignore = ["D203", "D213", "D107", "S603"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101", "SLF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
