name: Dependencies ping
# Notifies merlin-pinpin/kingdoms when an issue changes in this repo so its
# sync-dependencies workflow can regenerate docs/DEPENDENCIES.md (graph,
# critical path, waves, priorities). Requires the ROADMAP_DISPATCH_PAT
# secret: a fine-grained PAT with "Contents: read AND write" permission on
# merlin-pinpin/kingdoms (repository_dispatch counts as a Contents write);
# until then, the kingdoms weekly schedule and manual workflow_dispatch act
# as the fallback.
on:
  issues:
    types: [opened, edited, reopened, closed]

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger dependencies sync in merlin-pinpin/kingdoms
        if: env.PAT_SET == 'true'
        env:
          PAT_SET: ${{ secrets.ROADMAP_DISPATCH_PAT != '' }}
          PAT: ${{ secrets.ROADMAP_DISPATCH_PAT }}
          SOURCE: ${{ github.event_name }}#${{ github.event.issue.number }}
        run: |
          code=$(curl -s -o /tmp/response.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${PAT}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/merlin-pinpin/kingdoms/dispatches" \
            -d "{\"event_type\": \"dependencies-sync\", \"client_payload\": {\"source\": \"${SOURCE}\"}}")
          if [ "$code" != "204" ]; then
            echo "::error::repository_dispatch failed with HTTP $code — check the ROADMAP_DISPATCH_PAT secret: it needs a fine-grained PAT with 'Contents: read and write' on merlin-pinpin/kingdoms. Response: $(cat /tmp/response.json)"
            exit 1
          fi
          echo "Dispatch sent (${SOURCE}), HTTP ${code}"
