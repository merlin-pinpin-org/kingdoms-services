name: Docs
# Generates the technical documentation (pydoc HTML) from this repo's own
# source into docs/DEVELOPMENT/pydoc/ — the source repo hosts its generated
# docs. On every PR, a freshness step fails when the committed copy is stale
# (fix: run `make docs` locally, or python3 .github/workflows/scripts/generate_pydoc.py, and
# commit the result). Fail-closed: the freshness check is a required gate.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  generate:
    name: Generate and check pydoc freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12.14"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Check pydoc freshness
        run: |
          uv run python .github/workflows/scripts/generate_pydoc.py \
            --source src/kingdoms \
            --output /tmp/pydoc-fresh
          if diff -rq /tmp/pydoc-fresh docs/DEVELOPMENT/pydoc \
            --exclude=.gitkeep > /tmp/pydoc-diff.txt 2>&1; then
            echo "Generated docs are fresh"
          else
            echo "::error::docs/DEVELOPMENT/pydoc is stale — regenerate with 'make docs' and commit"
            cat /tmp/pydoc-diff.txt
            sed -n '26,31p' /tmp/pydoc-fresh/kingdoms/mods/kingdoms.html > /tmp/chunk1
            sed -n '32,37p' /tmp/pydoc-fresh/kingdoms/mods/kingdoms.html > /tmp/chunk2
            sed -n '38,43p' /tmp/pydoc-fresh/kingdoms/mods/kingdoms.html > /tmp/chunk3
            sed -n '44,49p' /tmp/pydoc-fresh/kingdoms/mods/kingdoms.html > /tmp/chunk4
            sed -n '50,55p' /tmp/pydoc-fresh/kingdoms/mods/kingdoms.html > /tmp/chunk5
            sed -n '56,62p' /tmp/pydoc-fresh/kingdoms/mods/kingdoms.html > /tmp/chunk6
            sed -n '1,10p' /tmp/pydoc-diff.txt > /tmp/chunk0
            for c in 0 1 2 3 4 5 6; do
              echo "::error::CHUNK$c $(tr '\n' '~' < /tmp/chunk$c)"
            done
            exit 1
          fi
