name: Docs
# Generates the technical documentation (pydoc HTML) from this repo's own
# source into docs/DEVELOPMENT/pydoc/ — the source repo hosts its generated
# docs. On every PR, a freshness step fails when the committed copy is stale
# (fix: run `make docs` locally, or python3 .github/workflows/scripts/generate_pydoc.py, and
# commit the result). Fail-closed: the freshness check is a required gate.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  generate:
    name: Generate and check pydoc freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12.14"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Check pydoc freshness
        run: |
          uv run python .github/workflows/scripts/generate_pydoc.py \
            --source src/kingdoms \
            --output /tmp/pydoc-fresh
          if diff -rq /tmp/pydoc-fresh docs/DEVELOPMENT/pydoc \
            --exclude=.gitkeep > /tmp/pydoc-diff.txt 2>&1; then
            echo "Generated docs are fresh"
          else
            echo "::error::docs/DEVELOPMENT/pydoc is stale — regenerate with 'make docs' and commit"
            cat /tmp/pydoc-diff.txt
            exit 1
          fi
      # TEMPORARY (battle-room-categorie-v1): one-shot self-heal — when the
      # committed copy is stale on a PR, commit the CI-generated tree back
      # into the PR branch so the gate converges green on the next push.
      - name: One-shot auto-regenerate the stale pydoc into the branch
        if: failure() && github.event_name == 'pull_request'
        run: |
          echo "stale files:"
          cat /tmp/pydoc-diff.txt
          git config user.name "kingdoms-docs-bot"
          git config user.email "actions@users.noreply.github.com"
          rm -rf docs/DEVELOPMENT/pydoc
          cp -r /tmp/pydoc-fresh docs/DEVELOPMENT/pydoc
          git add docs/DEVELOPMENT/pydoc
          if git diff --cached --quiet; then
            echo "nothing to commit — fresh tree matches the committed one"
            exit 0
          fi
          git commit -m "docs(pydoc): auto-regenerate the stale pages (ci one-shot)"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
