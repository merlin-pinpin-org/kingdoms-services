# Temporary diagnostic workflow (Drasah 17/10) — DELETE after use.
# 1. surfaces the ruff/pytest failures as annotations (no log access),
# 2. regenerates docs/DEVELOPMENT/pydoc with the full dependency set and
#    commits it back (make docs needs discord.py — impossible locally).
name: debug-ci
on:
  push:
    branches: [vibe/drasah/main]

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Sync the dependencies
        run: uv sync
      - name: Ruff annotations
        if: always()
        run: uv run ruff check --output-format=github src/ tests/ || true
      - name: Pytest annotations
        if: always()
        run: |
          uv run pytest -q > /tmp/pytest.txt 2>&1 || true
          grep -E "^(FAILED|ERROR)" /tmp/pytest.txt | head -60 | while read -r line; do
            echo "::error::${line}"
          done
          tail -5 /tmp/pytest.txt
      - name: Regenerate the pydoc
        run: |
          uv run python .github/workflows/scripts/generate_pydoc.py \
            --source src/kingdoms --output docs/DEVELOPMENT/pydoc
      - name: Commit the regenerated pydoc
        run: |
          git config user.name "kingdoms-ci"
          git config user.email "ci@users.noreply.github.com"
          git add docs/DEVELOPMENT/pydoc
          if git diff --cached --quiet; then
            echo "pydoc already fresh"
            exit 0
          fi
          git commit -m "docs(kingdoms): pydoc régénéré (fenêtre de défense [T-15,T] + board Attaques)"
          git push
