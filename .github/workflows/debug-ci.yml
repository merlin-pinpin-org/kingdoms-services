name: Debug CI outputs (temporary, kingdoms patch diagnosis)

on:
  push:
    branches: [vibe/drasah/main]

jobs:
  debug:
    name: Debug mypy output (temporary)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: mypy with github annotations
        run: |
          uv sync
          uv run mypy src/ > mypy-out.log 2>&1 || true
          grep -E "error:" mypy-out.log | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          tail -20 mypy-out.log
