name: debug-ci

on:
  push:
    branches: [vibe/drasah/main]

jobs:
  debug:
    name: debug ruff+pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: ruff with annotations
        run: |
          uv sync
          set +e
          out=$(uv run ruff check src/ tests/ --output-format concise 2>&1)
          rc=$?
          echo "$out" | while IFS= read -r line; do
            f=$(echo "$line" | cut -d: -f1 | xargs)
            l=$(echo "$line" | cut -d: -f2)
            m=$(echo "$line" | cut -d: -f3-)
            echo "::error::RUFF ${f}:${l} ${m}"
          done
          set -e
      - name: pytest with annotations
        run: |
          set +e
          out=$(uv run pytest tests/unit -q 2>&1)
          echo "$out" | grep -E "^(FAILED|ERROR)" | while IFS= read -r line; do
            echo "::error::PYTEST ${line:0:300}"
          done
          echo "$out" | tail -5 | while IFS= read -r line; do
            echo "::error::PYTEST-TAIL ${line:0:300}"
          done
          set -e
