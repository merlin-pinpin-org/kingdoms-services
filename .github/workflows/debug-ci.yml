name: debug-ci

on:
  push:
    branches: [vibe/drasah/main]

jobs:
  debug:
    name: debug lint+types+tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: ruff
        run: |
          uv sync
          set +e
          uv run ruff check src/ tests/ --output-format concise 2>&1 | while IFS= read -r line; do
            echo "::error::RUFF ${line:0:280}"
          done
          exit 0
      - name: mypy
        run: |
          set +e
          uv run mypy src/ 2>&1 | while IFS= read -r line; do
            echo "::error::MYPY ${line:0:280}"
          done
          exit 0
      - name: pytest
        run: |
          set +e
          uv run pytest tests/unit -q 2>&1 | while IFS= read -r line; do
            case "$line" in
              FAILED*|ERROR*) echo "::error::PYTEST ${line:0:280}";;
            esac
          done
          exit 0
