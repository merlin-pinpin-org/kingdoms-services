name: Debug CI outputs (temporary, kingdoms patch diagnosis)

on:
  push:
    branches: [vibe/drasah/main]

jobs:
  debug:
    name: Debug ruff+pytest outputs (temporary)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: ruff with github annotations
        run: |
          uv sync
          uv run ruff check --output-format=github src/ tests/ || true
      - name: pytest with github annotations
        run: |
          uv sync
          set +e
          uv run pytest -q --tb=short > pytest-out.log 2>&1
          status=$?
          echo "pytest exit=$status"
          grep -E "^(FAILED|ERROR)" pytest-out.log | head -50 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          tail -120 pytest-out.log
          exit 0
