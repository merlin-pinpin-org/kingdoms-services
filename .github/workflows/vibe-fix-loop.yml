name: Vibe session checks

# Temporary session tooling for kingdoms-services#175: integrates the base
# branch into this stacked branch (resolving conflicts per scripted policy,
# squashed onto the base to keep a rebase-only, conventional-commits
# history), applies drift fixes, replays the checks and reports as a PR
# comment. Removed once the stack is green.

on:
  push:
    branches:
      - feat/kingdoms-salon-content

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: vibe-session-checks
  cancel-in-progress: false

env:
  PR_NUMBER: "171"
  BASE: vibe/kingdoms-salons-first-cbeb55
  BASE_FALLBACK_SHA: 9f5ecd3c7fac19872922379fad5cd2129f3ac573

jobs:
  checks:
    name: Vibe session checks
    runs-on: ubuntu-latest
    env:
      BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12.14"
      - name: Install dependencies
        run: uv sync --frozen 2>&1 | tee /tmp/sync.log
        continue-on-error: true
      - name: Integrate the base branch and squash onto it
        run: |
          {
            set +e
            git config user.name "Drasah"
            git config user.email "mabilais.dylan@hotmail.fr"
            BASE_SHA=""
            if git rev-parse --verify "refs/remotes/origin/$BASE" >/dev/null 2>&1; then
              BASE_SHA=$(git rev-parse "refs/remotes/origin/$BASE")
            else
              echo "no remote-tracking ref for $BASE; fetching explicitly"
              if git fetch origin "+refs/heads/$BASE:refs/remotes/origin/$BASE"; then
                BASE_SHA=$(git rev-parse "refs/remotes/origin/$BASE")
              fi
            fi
            if [ -z "$BASE_SHA" ]; then
              echo "falling back to pinned base sha $BASE_FALLBACK_SHA"
              BASE_SHA="$BASE_FALLBACK_SHA"
            fi
            echo "base sha: $BASE_SHA"
            if git merge-base --is-ancestor "$BASE_SHA" HEAD; then
              echo "base already integrated in HEAD"
            else
              echo "integrating the base with the scripted conflict resolution"
              git merge --no-ff --no-commit "$BASE_SHA"
              UNMERGED=$(git diff --name-only --diff-filter=U | wc -l)
              echo "unmerged files: $UNMERGED"
              if [ "$UNMERGED" -ne 0 ]; then
                git diff --name-only --diff-filter=U
                python3 scripts/vibe_merge_resolve.py
                git add -A
                UNMERGED=$(git diff --name-only --diff-filter=U | wc -l)
              fi
              if [ "$UNMERGED" -eq 0 ]; then
                git commit \
                  -m "temp: integrate the salons-first base branch (session tooling)" \
                  -m "Co-authored-by: Mistral AI <noreply@mistral.ai>"
              else
                git merge --abort
                echo "merge aborted; unresolved conflicts remain"
              fi
            fi
            TREE=$(git rev-parse "HEAD^{tree}")
            NEW=$(git commit-tree "$TREE" -p "$BASE_SHA" \
              -m "feat: salons-first live content for the kingdoms mod (kingdoms-services#171)" \
              -m "Co-authored-by: Mistral AI <noreply@mistral.ai>")
            if [ "$NEW" = "$(git rev-parse HEAD)" ]; then
              echo "history already squashed onto the base"
            else
              echo "squashing the branch onto the base as $NEW"
              git push --force origin "$NEW:refs/heads/feat/kingdoms-salon-content"
              git reset --hard "$NEW"
            fi
          } > /tmp/merge.log 2>&1
          cat /tmp/merge.log
        continue-on-error: true
      - name: Apply session fixes and commit
        run: |
          uv run python scripts/vibe_fix.py 2>&1 | tee /tmp/fix.log
          uv run ruff check --fix src/ tests/ 2>&1 | tee -a /tmp/fix.log || true
          if ! git diff --quiet; then
            git config user.name "Drasah"
            git config user.email "mabilais.dylan@hotmail.fr"
            git add -A
            git commit \
              -m "fix: apply the kingdoms-services#175 drift fixes (session tooling)" \
              -m "Co-authored-by: Mistral AI <noreply@mistral.ai>"
            git push origin HEAD:"$BRANCH" 2>&1 | tee -a /tmp/fix.log
          fi
        continue-on-error: true
      - name: Unit tests (pytest)
        run: uv run pytest -q --tb=short 2>&1 | tee /tmp/pytest.log
        continue-on-error: true
      - name: Lint (ruff)
        run: uv run ruff check src/ tests/ 2>&1 | tee /tmp/ruff.log
        continue-on-error: true
      - name: Typecheck (mypy)
        run: uv run mypy src/ 2>&1 | tee /tmp/mypy.log
        continue-on-error: true
      - name: Lint workflows (actionlint) and pin-payload guard
        run: |
          {
            mkdir -p "$HOME/.local/bin"
            bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) latest "$HOME/.local/bin"
            "$HOME/.local/bin/actionlint" -color; echo "actionlint rc: $?"
            ./scripts/check_pin_payloads.sh; echo "pin-payload rc: $?"
          } > /tmp/actionlint.log 2>&1
          cat /tmp/actionlint.log
        continue-on-error: true
      - name: Check Conventional Commits (commitizen)
        run: |
          {
            pipx install commitizen
            git fetch origin main --quiet
            cz check --rev-range origin/main..HEAD; echo "cz rc: $?"
          } > /tmp/czcheck.log 2>&1
          cat /tmp/czcheck.log
        continue-on-error: true
      - name: Regenerate pydoc and commit when stale
        run: |
          set -x
          uv run python scripts/generate_pydoc.py \
            --source src/kingdoms \
            --output /tmp/pydoc-fresh 2>&1 | tee /tmp/pydoc.log
          if diff -rq /tmp/pydoc-fresh docs/DEVELOPMENT/pydoc \
            --exclude=.gitkeep > /tmp/pydoc-diff.txt 2>&1; then
            echo "pydoc is fresh"
          else
            tee -a /tmp/pydoc.log < /tmp/pydoc-diff.txt
            rm -rf docs/DEVELOPMENT/pydoc
            mkdir -p docs/DEVELOPMENT/pydoc
            cp -r /tmp/pydoc-fresh/. docs/DEVELOPMENT/pydoc/
            git config user.name "Drasah"
            git config user.email "mabilais.dylan@hotmail.fr"
            git add docs/DEVELOPMENT/pydoc
            git commit \
              -m "docs: regenerate pydoc after the drift fixes (kingdoms-services#175)" \
              -m "Co-authored-by: Mistral AI <noreply@mistral.ai>"
            git push origin HEAD:"$BRANCH" 2>&1 | tee -a /tmp/pydoc.log
          fi
        continue-on-error: true
      - name: Report on the PR
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import urllib.request

          def tail(name, limit):
              p = pathlib.Path("/tmp/%s.log" % name)
              if not p.exists():
                  return "(no output)"
              return p.read_text(errors="replace")[-limit:]

          body = (
              "## Vibe session checks\n\n### merge\n```\n"
              + tail("merge", 12000)
              + "\n```\n### fixes\n```\n"
              + tail("fix", 30000)
              + "\n```\n### pytest\n```\n"
              + tail("pytest", 10000)
              + "\n```\n### ruff\n```\n"
              + tail("ruff", 6000)
              + "\n```\n### mypy\n```\n"
              + tail("mypy", 6000)
              + "\n```\n### actionlint\n```\n"
              + tail("actionlint", 6000)
              + "\n```\n### commitizen\n```\n"
              + tail("czcheck", 6000)
              + "\n```\n### pydoc\n```\n"
              + tail("pydoc", 2000)
              + "\n```\n"
          )
          payload = json.dumps({"body": body}).encode()
          req = urllib.request.Request(
              "https://api.github.com/repos/merlin-pinpin-org/kingdoms-services/issues/"
              + os.environ["PR_NUMBER"]
              + "/comments",
              data=payload,
              headers={
                  "Authorization": "token " + os.environ["GITHUB_TOKEN"],
                  "Accept": "application/vnd.github+json",
              },
              method="POST",
          )
          urllib.request.urlopen(req)
          PY
