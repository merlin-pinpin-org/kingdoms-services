name: Vibe session checks

# Temporary session tooling for kingdoms-services#175: replays the unit
# tests, lint and type checks on every push and reports the failures as a
# PR comment so the vibe session can iterate without local tooling.
# Regenerates the pydoc pages and commits them when stale (make docs).
# This file is removed once the stack is green.

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  checks:
    name: Vibe session checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12.14"
      - name: Install dependencies
        run: uv sync --frozen 2>&1 | tee /tmp/sync.log
        continue-on-error: true
      - name: Unit tests (pytest)
        run: uv run pytest -q --tb=short 2>&1 | tee /tmp/pytest.log
        continue-on-error: true
      - name: Lint (ruff)
        run: uv run ruff check . 2>&1 | tee /tmp/ruff.log
        continue-on-error: true
      - name: Typecheck (mypy)
        run: uv run mypy . 2>&1 | tee /tmp/mypy.log
        continue-on-error: true
      - name: Regenerate pydoc and commit when stale
        run: |
          set -x
          uv run python scripts/generate_pydoc.py \
            --source src/kingdoms \
            --output /tmp/pydoc-fresh 2>&1 | tee /tmp/pydoc.log
          if diff -rq /tmp/pydoc-fresh docs/DEVELOPMENT/pydoc \
            --exclude=.gitkeep > /tmp/pydoc-diff.txt 2>&1; then
            echo "pydoc is fresh"
          else
            cat /tmp/pydoc-diff.txt | tee -a /tmp/pydoc.log
            rm -rf docs/DEVELOPMENT/pydoc
            mkdir -p docs/DEVELOPMENT/pydoc
            cp -r /tmp/pydoc-fresh/. docs/DEVELOPMENT/pydoc/
            git config user.name "Drasah"
            git config user.email "mabilais.dylan@hotmail.fr"
            git add docs/DEVELOPMENT/pydoc
            git commit \
              -m "docs: regenerate pydoc after the salons-first drift fixes (kingdoms-services#175)" \
              -m "Co-authored-by: Mistral AI <noreply@mistral.ai>"
            git push 2>&1 | tee -a /tmp/pydoc.log
          fi
        continue-on-error: true
      - name: Report on the PR
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import urllib.request

          def tail(name, limit=9000):
              p = pathlib.Path("/tmp/%s.log" % name)
              if not p.exists():
                  return "(no output)"
              return p.read_text(errors="replace")[-limit:]

          body = (
              "## Vibe session checks\n\n### pytest\n```\n"
              + tail("pytest")
              + "\n```\n### ruff\n```\n"
              + tail("ruff")
              + "\n```\n### mypy\n```\n"
              + tail("mypy")
              + "\n```\n### pydoc\n```\n"
              + tail("pydoc")
              + "\n```\n"
          )
          payload = json.dumps({"body": body}).encode()
          req = urllib.request.Request(
              "https://api.github.com/repos/merlin-pinpin-org/kingdoms-services/issues/"
              + os.environ["PR_NUMBER"]
              + "/comments",
              data=payload,
              headers={
                  "Authorization": "token " + os.environ["GITHUB_TOKEN"],
                  "Accept": "application/vnd.github+json",
              },
              method="POST",
          )
          urllib.request.urlopen(req)
          PY
