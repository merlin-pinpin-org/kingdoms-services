name: Check commits

# Conventional Commits enforcement (kingdoms-services#28): every commit
# on a PR must match the specification — the release changelog
# (.github/workflows/scripts/generate_changelog.py) groups commits by type, so a
# non-conventional subject would silently drop out of the release notes.
# The history is already 100% conventional (squash merges); this locks it
# in at the only gate where it matters: the PR.
#
# Only the commits are linted: the PR title follows the session
# convention (vibe[<user>] <conversation title>) and never reaches main's
# history — sessions rewrite the squash-merge subject by hand.
#
# Merge commits are excluded: their subjects are generated by git during
# branch syncs (e.g. "Update branch" / main backmerges) and never reach
# main's history, since sessions always squash-merge. Only authored
# commits can end up in the changelog, so only those are linted.

on: [pull_request]

permissions:
  contents: read

jobs:
  commit-lint:
    name: Check Conventional Commits (commitizen)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install commitizen
        run: pipx install commitizen
      - name: Validate every commit of the PR
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          mapfile -t shas < <(git rev-list --no-merges origin/main..HEAD)
          if [ "${#shas[@]}" -eq 0 ]; then
            echo "No commits to validate."
            exit 0
          fi
          for sha in "${shas[@]}"; do
            git log -1 --format=%B "$sha" > /tmp/cz-msg.txt
            cz check --commit-msg-file /tmp/cz-msg.txt
          done
