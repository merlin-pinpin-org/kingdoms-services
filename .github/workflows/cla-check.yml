name: CLA Check
# Roster-driven CLA check (email process — see CLA.md and the roster):
# a contributor signs the CLA and emails it to a maintainer; the
# maintainer's roster PR (cla: accepted) is the recorded acceptance.
# This check reads CONTRIBUTORS.md on kingdoms main and verifies the PR
# author has an accepted CLA. The /cla comment flow is gone — the roster
# is the only record. Job name must stay `cla` exactly: the main ruleset
# matches the required check context by name.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the roster (kingdoms main — the CLA record)
        uses: actions/checkout@v4
        with:
          repository: merlin-pinpin-org/kingdoms
          ref: main
          sparse-checkout: |
            CONTRIBUTORS.md
            .github/workflows/scripts/roster.py

      - name: Verify the PR author's CLA against the roster
        run: |
          set -euo pipefail
          author="${{ github.event.pull_request.user.login }}"
          python3 - "$author" <<'PY'
          import sys
          sys.path.insert(0, ".github/workflows/scripts")
          from roster import parse_roster
          author = sys.argv[1]
          roster = parse_roster("CONTRIBUTORS.md")
          person = roster.get(author)
          if person and person.cla.lower().startswith("accepted"):
              print(f"CLA accepted: {person.alias} ({person.cla}).")
              sys.exit(0)
          if person:
              print(f"::error::{author} ({person.alias}) has no accepted CLA on record (roster says: {person.cla}).")
              print("::error::Email the signed CLA (CLA.md / CLA.pdf in the kingdoms repo) to a maintainer — the maintainer's roster PR records the acceptance; there is no comment flow.")
              sys.exit(1)
          print(f"::error::{author} has no roster entry (CONTRIBUTORS.md). A maintainer onboarding PR (entry + cla: accepted) is required before this PR can merge.")
          sys.exit(1)
          PY
