# /deploy-test — deploy a pull request to the test environment.
# A PR comment containing exactly "/deploy-test" builds the bot image from
# the PR head, pushes it to GHCR (tag pr-<id>-<timestamp>-<sha>), and pins it
# in the kingdoms-infra deploy/test state branch (ADR-0018). The state push
# triggers the Deploy test workflow on kingdoms-infra, which reads the
# image from Git. The bot runs on the test VPS with the PR code until the
# next state commit.
# Gating (kingdoms-services#67): only repository collaborators with
# write, maintain or admin permission may use it, and fork PRs are rejected
# outright (see the authorize step); kingdoms-infra's Actions policy is the
# second layer on the dispatch side.
#
# Cross-repo state write: committing to the kingdoms-infra deploy/test
# branch uses an ephemeral GitHub App token (actions/create-github-app-token),
# minted from the KINGDOMS_DEPLOYER_APP_ID / KINGDOMS_DEPLOYER_APP_PRIVATE_KEY
# repository secrets of this repository. The app is installed on
# kingdoms-infra only, with Actions: write + Contents: write — see
# kingdoms-infra docs/DEPLOY-TEST-APP.md for the full setup and the
# ruleset hardening.

name: Deploy test (PR comment)

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  packages: write
  pull-requests: write

concurrency:
  group: deploy-test-pr-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  deploy-test:
    name: Build and deploy the PR to test
    if: >
      github.event.issue.pull_request &&
      github.event.comment.body == '/deploy-test'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the PR head
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            core.setOutput("sha", pr.head.sha);
            core.setOutput("ref", pr.head.ref);

      - name: Stamp the image tag timestamp
        id: stamp
        run: echo "timestamp=$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Authorize the requestor
        id: authorize
        uses: actions/github-script@v7
        with:
          script: |
            const commenter = context.payload.comment.user.login;
            // Fork PRs are never deployable, regardless of who comments:
            // their head lives outside this repository (kingdoms-services#67).
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            if (pr.head.repo && pr.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.setFailed("This pull request comes from a fork: only branches of this repository may be deployed to test.");
              return;
            }
            const { data: perm } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: commenter,
            });
            if (!["admin", "maintain", "write"].includes(perm.permission)) {
              core.setFailed(`${commenter} is not allowed to deploy: only repository collaborators with write access may use /deploy-test.`);
            } else {
              core.notice(`${commenter} has ${perm.permission}: allowed.`);
            }

      - name: Acknowledge on the PR
        id: acknowledge
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comment } = await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🚀 Deploying this PR to **test** — building \`${{ steps.pr.outputs.sha }}\`… (run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
            });
            core.setOutput("permalink", comment.html_url);

      - name: Checkout the PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the PR image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:pr-${{ github.event.issue.number }}-${{ steps.stamp.outputs.timestamp }}-${{ steps.pr.outputs.sha }}
          # No cache export: from an issue_comment event the GHA cache
          # scope is the comment, not the PR branch, and cache
          # reservation fails. Pull-side caching only.
          cache-from: type=gha


      - name: Mint an ephemeral GitHub App token for kingdoms-infra
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.KINGDOMS_DEPLOYER_APP_ID }}
          private-key: ${{ secrets.KINGDOMS_DEPLOYER_APP_PRIVATE_KEY }}
          owner: merlin-pinpin-org
          repositories: kingdoms-infra

      - name: Pin the PR image in the kingdoms-infra deploy/test state branch
        id: pin-state
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const owner = "merlin-pinpin-org", repo = "kingdoms-infra";
            const path = "deploy/state/test/kingdoms-bot.yml";
            const branch = "deploy/test";
            const pr = context.issue.number;
            const sha = "${{ steps.pr.outputs.sha }}";
            const label = "pr-" + pr + "-${{ steps.stamp.outputs.timestamp }}-" + sha.slice(0, 7);
            const image = `ghcr.io/merlin-pinpin-org/kingdoms-services:${label}`;
            const url = "${{ steps.acknowledge.outputs.permalink }}";
            let base;
            try {
              base = (await github.rest.repos.getContent({ owner, repo, path, ref: branch })).data;
            } catch (e) {
              core.setFailed(`state file ${path} missing on ${branch} (bootstrap kingdoms-infra#41)`);
              return;
            }
            const state = [
              "# Desired state of kingdoms-bot on the test environment (ADR-0018).",
              "# Written by the deploy pipelines only (kingdoms-deployer GitHub App);",
              "# a push to this branch deploys this exact image.",
              `image: ${image}`,
              `version_label: ${label}`,
              `deploy_url: ${url}`,
              `deployed_by: ${{ github.event.comment.user.login }} (/deploy-test)`,
              `deployed_at: "${new Date().toISOString()}"`,
              `source: ${url} (commit ${sha.slice(0, 7)})`,
              ""].join("\n");
            const commit = await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch,
              message: `deploy(test): pin ${label} (${url})`,
              content: Buffer.from(state).toString("base64"),
              sha: base.sha,
            });
            core.notice(`state pinned on ${branch}: ${image}`);
            core.setOutput("state_url", commit.data.commit.html_url);

      - name: Report success on the PR
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `✅ Image \`pr-${{ github.event.issue.number }}-${{ steps.stamp.outputs.timestamp }}-${{ steps.pr.outputs.sha }}\` built and pushed, and pinned in the [deploy/test state branch](${{ steps.pin-state.outputs.state_url }}) — kingdoms-infra is deploying it; the bot on the test VPS now runs this PR.`,
            });

      - name: Report failure on the PR
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `❌ /deploy-test failed — see the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for details.`,
            });
