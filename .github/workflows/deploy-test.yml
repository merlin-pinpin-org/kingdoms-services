# /deploy-test — deploy a pull request to the test environment.
# A PR comment containing exactly "/deploy-test" builds the bot image from
# the PR head, pushes it to GHCR (tag pr-<id>-<timestamp>-<sha>), then
# dispatches the kingdoms-infra Pin state workflow (single-writer design,
# ADR-0018): it pins the image in the deploy/test state branch, merging
# main in the same commit, serialized with every other state-branch writer
# by the shared deploy-state-<env> concurrency group. The state push
# triggers the Deploy test workflow on kingdoms-infra, which reads the
# image from Git. The bot runs on the test VPS with the PR code until the
# next state commit.
# Gating (kingdoms-services#67): only repository collaborators with
# write, maintain or admin permission may use it, and fork PRs are rejected
# outright (see the authorize step); kingdoms-infra's Actions policy is the
# second layer on the dispatch side.
#
# Cross-repo state write: the dispatch uses an ephemeral GitHub App token
# (actions/create-github-app-token), minted from the
# KINGDOMS_DEPLOYER_APP_ID / KINGDOMS_DEPLOYER_APP_PRIVATE_KEY repository
# secrets of this repository. The app is installed on kingdoms-infra only,
# with Actions: write + Contents: write — see kingdoms-infra
# docs/DEPLOY-TEST-APP.md for the full setup and the ruleset hardening.

name: Deploy test (PR comment)

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  packages: write
  pull-requests: write

concurrency:
  group: deploy-test-pr-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  deploy-test:
    name: Build and deploy the PR to test
    if: >
      github.event.issue.pull_request &&
      github.event.comment.body == '/deploy-test'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the PR head
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            core.setOutput("sha", pr.head.sha);
            core.setOutput("ref", pr.head.ref);

      - name: Stamp the image tag timestamp
        id: stamp
        run: echo "timestamp=$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Authorize the requestor
        id: authorize
        uses: actions/github-script@v7
        with:
          script: |
            const commenter = context.payload.comment.user.login;
            // Fork PRs are never deployable, regardless of who comments:
            // their head lives outside this repository (kingdoms-services#67).
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            if (pr.head.repo && pr.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.setFailed("This pull request comes from a fork: only branches of this repository may be deployed to test.");
              return;
            }
            const { data: perm } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: commenter,
            });
            if (!["admin", "maintain", "write"].includes(perm.permission)) {
              core.setFailed(`${commenter} is not allowed to deploy: only repository collaborators with write access may use /deploy-test.`);
            } else {
              core.notice(`${commenter} has ${perm.permission}: allowed.`);
            }

      - name: Open the deployment tracking comment
        id: acknowledge
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              "<!-- kingdoms-deploy-tracking -->",
              "## 🚀 Deployment — test",
              "",
              `**Status:** 🟡 building`,
              "",
              "| | |",
              "| --- | --- |",
              `| Environment | \`test\` |`,
              `| Commit | [\`${{ steps.pr.outputs.sha }}\`](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/tree/${{ steps.pr.outputs.sha }}) |`,
              `| Image | (building…) |`,
              `| Pipeline | [run \`#${{ github.run_id }}\`](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) |`,
              `| Requested by | @${context.payload.comment.user.login} |`,
              "",
              `_Updated automatically as the deployment progresses._`,
            ].join("\n");
            const { data: comment } = await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
            core.setOutput("id", comment.id);
            core.setOutput("permalink", comment.html_url);

      - name: Mark the previous deployment as superseded
        uses: actions/github-script@v7
        with:
          script: |
            // A new /deploy-test supersedes any previous deployment comment
            // of this PR: mark it as rolled back (replaced), keep it for
            // the audit trail.
            const marker = "<!-- kingdoms-deploy-tracking -->";
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            for (const c of comments) {
              if (c.id === ${{ steps.acknowledge.outputs.id }}) continue;
              if (c.body.includes(marker)) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: c.id,
                  body: c.body.replace("**Status:** 🟡 building", "**Status:** 🔵 deploying")
                                    .replace("**Status:** 🟢 deployed", "**Status:** ⚪ superseded")
                                    .replace("**Status:** 🔵 deploying", "**Status:** ⚪ superseded"),
                });
              }
            }

      - name: Checkout the PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.sha }}

      - name: Compute the short image label
        id: label
        env:
          PR_SHA: ${{ steps.pr.outputs.sha }}
        run: |
          # Short label (sha7): unique per build thanks to the second-precision
          # timestamp; the state pins this exact pushed tag (labels everywhere
          # are short — /status, tracking comment, pin commit message).
          echo "tag=pr-${{ github.event.issue.number }}-${{ steps.stamp.outputs.timestamp }}-${PR_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the PR image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ steps.label.outputs.tag }}
          # No cache export: from an issue_comment event the GHA cache
          # scope is the comment, not the PR branch, and cache
          # reservation fails. Pull-side caching only.
          cache-from: type=gha


      - name: Mint an ephemeral GitHub App token for kingdoms-infra
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.KINGDOMS_DEPLOYER_APP_ID }}
          private-key: ${{ secrets.KINGDOMS_DEPLOYER_APP_PRIVATE_KEY }}
          owner: merlin-pinpin-org
          repositories: kingdoms-infra

      # Single-writer design (ADR-0018): the pin itself is executed by the
      # kingdoms-infra Pin state workflow, which merges main into the state
      # branch in the same commit and shares the deploy-state-<env>
      # concurrency group with every other state-branch writer — the pin can
      # never race a sync. This workflow dispatches it and then polls the
      # state branch for the pin commit (identified by the unique image tag)
      # to recover the state commit sha the deploy run will carry.
      - name: Dispatch the pin to the kingdoms-infra Pin state workflow
        id: pin-state
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const pr = context.issue.number;
            const sha = "${{ steps.pr.outputs.sha }}";
            const timestamp = "${{ steps.stamp.outputs.timestamp }}";
            // The pushed image tag (Build and push step) is the SHORT label
            // (sha7) — the state must pin exactly that pushed tag. The
            // client_payload is capped at 10 properties by the GitHub API:
            // message, source and deploy_ts are composed by the Pin state
            // workflow itself.
            const label = "${{ steps.label.outputs.tag }}";
            const image = `ghcr.io/merlin-pinpin-org/kingdoms-services:${label}`;
            // The deployed commit's source branch and the PR title feed the
            // /status Services section (Branch and Pull-request lines).
            const { data: prData } = await github.rest.pulls.get({
              owner: context.repo.owner, repo: context.repo.repo, pull_number: pr,
            });
            await github.rest.repos.createDispatchEvent({
              owner: "merlin-pinpin-org",
              repo: "kingdoms-infra",
              event_type: "pin-state",
              client_payload: {
                env: "test",
                image,
                version_label: label,
                // /status Version field: for a PR deploy the link points at
                // the deployment comment that triggered it (the tracking
                // comment keeps the human trace: requester, pipeline,
                // image, deploy run).
                deploy_url: "${{ steps.acknowledge.outputs.permalink }}",
                deploy_kind: "pr",
                deploy_ref: String(pr),
                deploy_tree_url: `https://github.com/merlin-pinpin-org/kingdoms-services/tree/${sha}`,
                deploy_branch: prData.head.ref,
                deploy_pr_title: prData.title,
                deployed_by: `${context.payload.comment.user.login} (/deploy-test)`,
              },
            });
            core.notice(`pin-state dispatched for ${image}`);

      - name: Update the tracking comment — deploying
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comment } = await github.rest.issues.getComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: ${{ steps.acknowledge.outputs.id }},
            });
            const shortImage = "${{ steps.label.outputs.tag }}";
            const body = comment.body
              .replace("**Status:** 🟡 building", "**Status:** 🔵 deploying")
              .replace("| Image | (building…) |", `| Image | [\`${shortImage}\`](https://github.com/merlin-pinpin-org/kingdoms-services/pkgs/container/kingdoms-services) |`);
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: comment.id,
              body,
            });

      - name: Watch the kingdoms-infra deploy run
        id: watch-infra
        if: success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            // The dispatched Pin state workflow on kingdoms-infra commits the
            // pin on deploy/test (merging main in the same commit); that
            // push triggers the Deploy test workflow there. First poll the
            // state branch for OUR pin commit — identified by the unique
            // image tag in the commit message — to recover the state commit
            // sha the deploy run will carry. Then watch that exact run.
            const infraOwner = "merlin-pinpin-org", infraRepo = "kingdoms-infra";
            const pr = context.issue.number;
            const sha = "${{ steps.pr.outputs.sha }}";
            // The pin commit message carries the SHORT version label (the
            // payload's version_label), not the full image tag — match on it.
            const imageTag = `pr-${pr}-${{ steps.stamp.outputs.timestamp }}-${sha.slice(0, 7)}`;
            // The Pin state run may queue behind a sync (shared deploy-state
            // concurrency group) — allow up to 30 minutes before giving up.
            const findDeadline = Date.now() + 30 * 60 * 1000;
            let stateCommit = null;
            while (Date.now() < findDeadline && !stateCommit) {
              const { data: commits } = await github.rest.repos.listCommits({
                owner: infraOwner, repo: infraRepo,
                sha: "deploy/test",
                path: "envs/test/state/kingdoms-bot.yml",
                per_page: 10,
              });
              stateCommit = commits.find((c) => c.commit.message.includes(imageTag)) || null;
              core.info(`pin commit on deploy/test: ${stateCommit ? stateCommit.sha : "not landed yet"}`);
              if (!stateCommit) await new Promise((r) => setTimeout(r, 20000));
            }
            if (!stateCommit) {
              core.setFailed("the pin never landed on deploy/test (30 min deadline) — check the kingdoms-infra Pin state workflow run");
              return;
            }
            const stateSha = stateCommit.sha;
            const deadline = Date.now() + 15 * 60 * 1000;
            let run = null;
            while (Date.now() < deadline) {
              const { data: { workflow_runs: runs } } = await github.rest.actions.listWorkflowRuns({
                owner: infraOwner, repo: infraRepo, workflow_id: "deploy-test.yml", branch: "deploy/test", per_page: 5,
              });
              // Only the run for the exact pinned state commit is ours: an
              // older run on the branch (a previous deploy) must not be
              // picked up while ours has not started yet.
              run = runs.find((r) => r.head_sha === stateSha) || null;
              core.info(`infra deploy run: ${run ? run.html_url + " (" + run.status + ")" : "not started yet"}`);
              if (run && run.status === "completed") break;
              await new Promise((r) => setTimeout(r, 20000));
            }
            if (!run) core.setFailed("the kingdoms-infra deploy run for the pinned state commit never started (15 min deadline)");
            const runUrl = run ? run.html_url : `${context.serverUrl}/${infraOwner}/${infraRepo}/actions`;
            const ok = run && run.conclusion === "success";
            core.setOutput("run_url", runUrl);
            core.setOutput("ok", ok ? "true" : "false");
            if (!ok) core.setFailed(`the kingdoms-infra deploy run did not succeed: ${runUrl}`);

      - name: Update the tracking comment — deployed
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comment } = await github.rest.issues.getComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: ${{ steps.acknowledge.outputs.id }},
            });
            const ok = "${{ steps.watch-infra.outputs.ok }}" === "true";
            const body = comment.body.replace(
              /\*\*Status:\*\* [^\n]*/,
              `**Status:** ${ok ? "🟢 deployed" : "❌ failed"} — [infra deploy run](${{ steps.watch-infra.outputs.run_url }})`,
            );
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: comment.id,
              body,
            });

      - name: Update the tracking comment — failed
        if: failure() || cancelled()
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comment } = await github.rest.issues.getComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: ${{ steps.acknowledge.outputs.id }},
            });
            const body = comment.body.replace(
              /\*\*Status:\*\* [^\n]*/,
              `**Status:** ❌ failed — see the [pipeline run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
            );
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: comment.id,
              body,
            });
