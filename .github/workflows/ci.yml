name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  actionlint:
    name: Lint workflows (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install actionlint
        run: |
          # bash installer from the actionlint releases (checksum-verified
          # by the script itself); it extracts the binary into the given
          # directory, so that directory goes on PATH.
          mkdir -p "$HOME/.local/bin"
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) latest "$HOME/.local/bin"
          "$HOME/.local/bin/actionlint" --version
      - name: Run actionlint
        run: actionlint -color
      - name: Run the pin-payload cap guard
        run: ./scripts/check_pin_payloads.sh
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Run ruff
        run: |
          uv sync
          uv run ruff check src/ tests/

  typecheck:
    name: Typecheck (mypy strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Run mypy
        run: |
          uv sync
          uv run mypy src/

  test:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Run pytest
        run: |
          uv sync
          uv run pytest

  purity-guard:
    # kingdoms-services#106: production code must never reference test
    # tooling, and the runtime image must never contain it. The image
    # side runs in the Docker workflow on the actually-built artifact;
    # this job gives the fast source-level signal on every PR.
    name: Purity guard (src/ free of test tooling)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check source purity
        run: ./scripts/check_image_purity.py --source-only

  compose:
    name: Validate and boot docker-compose.yml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the compose manifest
        run: docker compose config --quiet
      - name: Boot the stack (bot excluded until kingdoms-services#12)
        run: |
          cp .env.example .env
          docker compose up -d kingdoms-mongo kingdoms-redis
          timeout 60 bash -c "until docker compose exec -T kingdoms-mongo mongosh --quiet --eval 'db.adminCommand(\"ping\")' | grep -q ok; do sleep 2; done"
          timeout 60 bash -c "until docker compose exec -T kingdoms-redis redis-cli ping | grep -q PONG; do sleep 2; done"
          echo "COMPOSE STACK BOOTS OK"
      - name: Tear down
        if: always()
        run: docker compose down -v || true

  discord-smoke:
    name: Discord smoke (real gateway via the CI/CD bot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail closed on the CI/CD bot token
        env:
          CICD_DISCORD_TOKEN: ${{ secrets.CICD_DISCORD_TOKEN }}
        run: |
          if [ -z "$CICD_DISCORD_TOKEN" ]; then
            echo "::error::CICD_DISCORD_TOKEN is not configured — create the CI/CD bot and add the secret (kingdoms-services#34)"
            exit 1
          fi
          echo "CICD_DISCORD_TOKEN is present"
      - name: Build the bot image
        run: docker build -t kingdoms-bot:ci .
      - name: Start MongoDB and Redis
        run: |
          docker network create kingdoms-ci
          docker run -d --name kingdoms-mongo --network kingdoms-ci mongo:7.0
          docker run -d --name kingdoms-redis --network kingdoms-ci redis:7.2
      - name: Wait for MongoDB and Redis
        run: |
          timeout 60 bash -c "until docker exec kingdoms-mongo mongosh --quiet --eval 'db.adminCommand(\"ping\")' | grep -q ok; do sleep 2; done"
          timeout 60 bash -c "until docker exec kingdoms-redis redis-cli ping | grep -q PONG; do sleep 2; done"
      - name: Boot the real bot with the CI/CD token
        env:
          CICD_DISCORD_TOKEN: ${{ secrets.CICD_DISCORD_TOKEN }}
        run: |
          docker run -d --name kingdoms-bot-smoke --network kingdoms-ci \
            -e MONGO_URI=mongodb://kingdoms-mongo:27017 \
            -e REDIS_URI=redis://kingdoms-redis:6379 \
            -e DISCORD_TOKEN="$CICD_DISCORD_TOKEN" -e LOG_LEVEL=INFO \
            -e KINGDOMS_ANNOUNCE_ENABLED=0 \
            kingdoms-bot:ci
      - name: Assert the gateway ready signal
        run: |
          timeout 120 bash -c "until docker logs kingdoms-bot-smoke 2>&1 | grep -q KINGDOMS_BOT_READY; do
            if [ \"\$(docker inspect -f '{{.State.Status}}' kingdoms-bot-smoke)\" != running ]; then
              echo '::error::Bot container exited before reaching the gateway ready signal'
              docker logs kingdoms-bot-smoke
              exit 1
            fi
            sleep 2
          done"
          docker logs kingdoms-bot-smoke 2>&1 | grep KINGDOMS_BOT_READY
          echo "DISCORD GATEWAY READY OK"
      - name: Soak the bot for 60s (no crash loop)
        run: |
          sleep 60
          if [ "$(docker inspect -f "{{.State.Status}}" kingdoms-bot-smoke)" != "running" ]; then
            echo "::error::Bot container crashed during the soak window"
            docker logs --tail 50 kingdoms-bot-smoke
            exit 1
          fi
          restarts="$(docker inspect -f "{{.RestartCount}}" kingdoms-bot-smoke)"
          if [ "$restarts" != "0" ]; then
            echo "::error::Bot container restarted $restarts times during the soak window"
            docker logs --tail 50 kingdoms-bot-smoke
            exit 1
          fi
          echo "SOAK OK (60s, no restart)"
      - name: Show bot logs on failure (token masked)
        if: failure()
        env:
          CICD_DISCORD_TOKEN: ${{ secrets.CICD_DISCORD_TOKEN }}
        run: |
          docker logs kingdoms-bot-smoke 2>&1 | grep -v -F "$CICD_DISCORD_TOKEN" || true
          docker logs kingdoms-mongo || true
          docker logs kingdoms-redis || true
      - name: Cleanup
        if: always()
        run: |
          docker rm -f kingdoms-bot-smoke kingdoms-mongo kingdoms-redis || true
          docker network rm kingdoms-ci || true

  smoke:
    name: Smoke test (bot image + MongoDB + Redis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the bot image
        run: docker build -t kingdoms-bot:ci .

      - name: Start MongoDB and Redis
        run: |
          docker network create kingdoms-ci
          docker run -d --name kingdoms-mongo --network kingdoms-ci mongo:7.0
          docker run -d --name kingdoms-redis --network kingdoms-ci redis:7.2

      - name: Wait for MongoDB and Redis
        run: |
          timeout 60 bash -c "until docker exec kingdoms-mongo mongosh --quiet --eval 'db.adminCommand(\"ping\")' | grep -q ok; do sleep 2; done"
          timeout 60 bash -c "until docker exec kingdoms-redis redis-cli ping | grep -q PONG; do sleep 2; done"

      - name: Run the smoke test in the bot container
        env:
          MONGO_URI: mongodb://kingdoms-mongo:27017
          REDIS_URI: redis://kingdoms-redis:6379
        run: |
          docker run --rm --network kingdoms-ci \
            -e MONGO_URI -e REDIS_URI -e LOG_LEVEL=DEBUG \
            -v "$PWD/scripts/smoke_test.py:/app/smoke_test.py:ro" \
            --entrypoint python \
            kingdoms-bot:ci /app/smoke_test.py

      - name: Bot preflight via the real entrypoint (startup path check)
        env:
          MONGO_URI: mongodb://kingdoms-mongo:27017
          REDIS_URI: redis://kingdoms-redis:6379
          DISCORD_TOKEN: dummy-token-for-smoke
        run: |
          docker run --rm --network kingdoms-ci \
            -e MONGO_URI -e REDIS_URI -e DISCORD_TOKEN \
            kingdoms-bot:ci --preflight

      - name: Show dependency logs on failure
        if: failure()
        run: |
          docker logs kingdoms-mongo || true
          docker logs kingdoms-redis || true

      - name: Cleanup
        if: always()
        run: |
          docker rm -f kingdoms-mongo kingdoms-redis || true
          docker network rm kingdoms-ci || true
