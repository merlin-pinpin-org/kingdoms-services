# Ops commands — /logs, /restart, /start, /stop, /status, /rollback,
# /dump-db as PR or issue comments. The debugging and incident handle
# for ops (and the agent sessions working for them): read the test logs
# to debug a failed deployment, restart a stuck stack, roll a bad pin
# back, dump a database for a prod bug ticket.
#
# UX contract (kingdoms-services#195 review): ONE tracking comment per
# command, created at interception and UPDATED in place as the command
# progresses — never a stream of unrelated comments. The comment always
# carries: who ran it, the command, the target env, and the outcome
# (verdict → dispatched → run link / result). Large outputs (logs, dumps)
# are linked, not pasted.
#
# Gating (fail-closed, before any dispatch): the roster authority
# matrix (CONTRIBUTORS.md, kingdoms repo) decides per command through
# the reusable authorize.yml gate —
#   /logs /restart /start /stop /status   env-control or env-logs
#   /rollback                             rollback (ops only)
#   /dump-db                              db-dump  (ops only)
#
# Execution: kingdoms-infra owns the environments, so each command
# dispatches there through the kingdoms-deployer App token, ON the
# state branch deploy/<env> (the environment deployment branch policy
# only allows that ref).
name: Ops commands (comments)

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ops-commands-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  authorize:
    name: Parse, acknowledge, pre-check
    if: >-
      startsWith(github.event.comment.body, '/logs') ||
      startsWith(github.event.comment.body, '/restart') ||
      startsWith(github.event.comment.body, '/start') ||
      startsWith(github.event.comment.body, '/stop') ||
      startsWith(github.event.comment.body, '/status') ||
      startsWith(github.event.comment.body, '/rollback') ||
      startsWith(github.event.comment.body, '/dump-db')
    runs-on: ubuntu-latest
    outputs:
      command: ${{ steps.parse.outputs.command }}
      environment: ${{ steps.parse.outputs.environment }}
      capability: ${{ steps.parse.outputs.capability }}
      tracking_id: ${{ steps.ack.outputs.tracking_id }}
    steps:
      - name: Parse the command (untrusted input — env var, never inline)
        id: parse
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          body="$COMMENT_BODY"
          command="$(echo "$body" | awk '{print $1}')"
          case "$command" in
            /logs|/restart|/start|/stop|/status|/rollback|/dump-db) ;;
            *) echo "::error::unsupported command: $command"; exit 1 ;;
          esac
          env_name="$(echo "$body" | awk '{print $2}')"
          # A flag token in second position means the default env (test).
          [[ -n "$env_name" && "$env_name" != -* ]] || env_name="test"
          # Each command maps to one roster capability (CONTRIBUTORS.md
          # authority matrix): the routing and the gate share this mapping.
          case "${command#/}" in
            logs)    capability=env-logs ;;
            restart|start|stop|status) capability=env-control ;;
            rollback) capability=rollback ;;
            dump-db)  capability=db-dump ;;
          esac
          {
            echo "command=${command#/}"
            echo "environment=$env_name"
            echo "capability=$capability"
          } >> "$GITHUB_OUTPUT"

      - name: Open the tracking comment (updated in place, never duplicated)
        id: ack
        uses: actions/github-script@v7
        with:
          script: |
            const cmd = "${{ steps.parse.outputs.command }}";
            const env = "${{ steps.parse.outputs.environment }}";
            const who = context.payload.comment.user.login;
            const effects = {
              logs: "collecting the logs (read-only)",
              restart: "restarting the stack in place",
              start: "starting the stack in place",
              stop: "stopping the stack in place",
              status: "reporting the stack state (read-only)",
              rollback: "reverting to the previous pinned image",
              "dump-db": "dumping the databases",
            }[cmd];
            const body = [
              "<!-- kingdoms-ops-tracking -->",
              `**/${cmd} ${env}** — run by **@${who}**`,
              "",
              `**Status:** ⏳ ${effects} — checking authorization…`,
              "",
              "_Updated in place as the command progresses._",
            ].join("\n");
            const { data: comment } = await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
            core.setOutput("tracking_id", comment.id);

  # A reusable workflow can only be called at the job level (a job with
  # `uses:` cannot mix in `steps:`) — the roster gate is its own job
  # between the parse/ack job and the dispatch job. The gate posts its
  # own verdict comment; the tracking comment carries the outcome.
  gate:
    name: Roster gate
    needs: authorize
    uses: merlin-pinpin-org/kingdoms/.github/workflows/authorize.yml@main
    with:
      capability: ${{ needs.authorize.outputs.capability }}
      environment: ${{ needs.authorize.outputs.environment }}
      requestor: ${{ github.event.comment.user.login }}
      pr-number: ${{ github.event.issue.number }}

  execute:
    name: Dispatch to kingdoms-infra
    needs: [authorize, gate]
    runs-on: ubuntu-latest
    steps:
      - name: Mint the kingdoms-deployer App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.KINGDOMS_DEPLOYER_APP_ID }}
          private-key: ${{ secrets.KINGDOMS_DEPLOYER_APP_PRIVATE_KEY }}
          owner: merlin-pinpin-org
          repositories: kingdoms-infra

      - name: Mark the tracking comment — dispatching
        uses: actions/github-script@v7
        with:
          script: |
            const id = ${{ needs.authorize.outputs.tracking_id }};
            const { data: c } = await github.rest.issues.getComment({
              owner: context.repo.owner, repo: context.repo.repo, comment_id: id,
            });
            await github.rest.issues.updateComment({
              owner: context.repo.owner, repo: context.repo.repo, comment_id: id,
              body: c.body.replace(/\*\*Status:\*\* [^\n]*/,
                "**Status:** 🔵 dispatching to kingdoms-infra…"),
            });

      - name: Route the command
        id: route
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMAND: ${{ needs.authorize.outputs.command }}
          ENVIRONMENT: ${{ needs.authorize.outputs.environment }}
          REQUESTOR: ${{ github.event.comment.user.login }}
          THREAD: ${{ github.event.issue.number }}
        run: |
          case "$COMMAND" in
            logs)
              # /logs [env] [--service S] [--since 30m] [--from iso] [--to iso] [--tail N]
              # The env-logs job declares the GitHub environment <env> (its
              # secrets carry DISCORD_TOKEN), so the deployment branch policy
              # applies: dispatch on the state branch deploy/<env>, like every
              # other environment job, and forward the filter tokens as inputs.
              SERVICE="$(echo "$COMMENT_BODY" | grep -oP '(?<=--service )\S+' || true)"
              SINCE="$(echo "$COMMENT_BODY" | grep -oP '(?<=--since )\S+' || true)"
              FROM="$(echo "$COMMENT_BODY" | grep -oP '(?<=--from )\S+' || true)"
              TO="$(echo "$COMMENT_BODY" | grep -oP '(?<=--to )\S+' || true)"
              TAIL="$(echo "$COMMENT_BODY" | grep -oP '(?<=--tail )\S+' || true)"
              ARGS=(--repo merlin-pinpin-org/kingdoms-infra --ref "deploy/$ENVIRONMENT" -f environment="$ENVIRONMENT")
              [[ -n "$SERVICE" ]] && ARGS+=(-f service="$SERVICE")
              [[ -n "$SINCE" ]]   && ARGS+=(-f since="$SINCE")
              [[ -n "$FROM" ]]    && ARGS+=(-f from="$FROM")
              [[ -n "$TO" ]]      && ARGS+=(-f to="$TO")
              [[ -n "$TAIL" ]]    && ARGS+=(-f tail="$TAIL")
              gh workflow run env-logs.yml "${ARGS[@]}"
              echo "workflow=Environment logs" >> "$GITHUB_OUTPUT"
              ;;
            restart|start|stop|status)
              # env-control is workflow_dispatch-only (two choice lists);
              # reuse it through gh workflow run with its own inputs.
              # Dispatch on the state branch deploy/<env>: the job targets
              # the GitHub environment <env>, whose deployment branch policy
              # only allows deploy/<env> — a dispatch from main is rejected
              # by the environment protection.
              gh workflow run env-control.yml \
                --repo merlin-pinpin-org/kingdoms-infra \
                --ref "deploy/$ENVIRONMENT" \
                -f command="$COMMAND" \
                -f environment="$ENVIRONMENT"
              echo "workflow=Environment control" >> "$GITHUB_OUTPUT"
              ;;
            rollback)
              gh api --method POST repos/merlin-pinpin-org/kingdoms-infra/dispatches \
                -f event_type=rollback-state \
                -f 'client_payload[env]='"$ENVIRONMENT" \
                -f 'client_payload[reason]="/'"$COMMAND"' requested by '"$REQUESTOR"' on #'"$THREAD" \
                -f 'client_payload[requestor]='"$REQUESTOR"
              echo "workflow=Rollback state" >> "$GITHUB_OUTPUT"
              ;;
            dump-db)
              gh workflow run db-daily-dump.yml \
                --repo merlin-pinpin-org/kingdoms-infra \
                --ref "deploy/$ENVIRONMENT" \
                -f environment="$ENVIRONMENT"
              echo "workflow=Daily DB dump" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Mark the tracking comment — dispatched (watch the run)
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const id = ${{ needs.authorize.outputs.tracking_id }};
            const wf = "${{ steps.route.outputs.workflow }}";
            const env = "${{ needs.authorize.outputs.environment }}";
            const { data: c } = await github.rest.issues.getComment({
              owner: context.repo.owner, repo: context.repo.repo, comment_id: id,
            });
            const body = c.body.replace(/\*\*Status:\*\* [^\n]*/,
              `**Status:** 🔵 dispatched — [${wf} runs on kingdoms-infra](https://github.com/merlin-pinpin-org/kingdoms-infra/actions?query=branch%3Adeploy%2F${env})`);
            await github.rest.issues.updateComment({
              owner: context.repo.owner, repo: context.repo.repo, comment_id: id, body,
            });

      - name: Mark the tracking comment — failed
        if: failure() || cancelled()
        uses: actions/github-script@v7
        with:
          script: |
            const id = ${{ needs.authorize.outputs.tracking_id }};
            const { data: c } = await github.rest.issues.getComment({
              owner: context.repo.owner, repo: context.repo.repo, comment_id: id,
            });
            const body = c.body.replace(/\*\*Status:\*\* [^\n]*/,
              `**Status:** ❌ failed — see the [pipeline run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`);
            await github.rest.issues.updateComment({
              owner: context.repo.owner, repo: context.repo.repo, comment_id: id, body,
            });
