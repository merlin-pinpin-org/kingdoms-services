# Ops commands — /logs, /restart, /rollback, /dump-db as PR or issue
# comments. The debugging and incident handle for ops (and the agent
# sessions working for them): read the test logs from a thread to debug
# a failed deployment, restart a stuck stack, roll a bad pin back,
# dump a database for a prod bug ticket.
#
# Gating (fail-closed, before any dispatch): the roster authority
# matrix (CONTRIBUTORS.md, kingdoms repo) decides per command through
# the reusable authorize.yml gate —
#   /logs      capability env-logs    (ops anywhere; dev on test)
#   /restart   capability env-control (ops anywhere; dev on test)
#   /rollback  capability rollback     (ops only)
#   /dump-db   capability db-dump     (ops only)
#   /reset-env capability env-reset   (self env only; ops anywhere)
# Every command gets an immediate acknowledgment: what will happen and
# why the requestor may ask for it.
#
# Execution: kingdoms-infra owns the environments, so each command
# dispatches there (repository_dispatch / workflow_dispatch through the
# kingdoms-deployer App token — same single-writer design as /deploy).
# The infra side runs on the environment's own runner and reports back.
name: Ops commands (comments)

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ops-commands-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  authorize:
    name: Parse, acknowledge, pre-check
    if: >-
      startsWith(github.event.comment.body, '/logs') ||
      startsWith(github.event.comment.body, '/restart') ||
      startsWith(github.event.comment.body, '/start') ||
      startsWith(github.event.comment.body, '/stop') ||
      startsWith(github.event.comment.body, '/status') ||
      startsWith(github.event.comment.body, '/rollback') ||
      startsWith(github.event.comment.body, '/dump-db') ||
      startsWith(github.event.comment.body, '/reset-env') ||
      startsWith(github.event.comment.body, '/seed')
    runs-on: ubuntu-latest
    outputs:
      command: ${{ steps.parse.outputs.command }}
      environment: ${{ steps.parse.outputs.environment }}
      capability: ${{ steps.parse.outputs.capability }}
    steps:
      - name: Parse the command (untrusted input — env var, never inline)
        id: parse
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENTER: ${{ github.event.comment.user.login }}
          GH_TOKEN: ${{ github.token }}
        run: |
          body="$COMMENT_BODY"
          command="$(echo "$body" | awk '{print $1}')"
          case "$command" in
            /logs|/restart|/start|/stop|/status|/rollback|/dump-db|/reset-env|/seed) ;;
            *) echo "::error::unsupported command: $command"; exit 1 ;;
          esac
          env_name="$(echo "$body" | awk '{print $2}')"
          # No explicit env means the requestor's personal environment
          # (their roster alias — sandbox first; e.g. "/status test"
          # targets the shared validation env explicitly). The alias is
          # resolved from the roster on kingdoms main via the GitHub
          # API, lowercased to match the env naming.
          if [[ -z "$env_name" || "$env_name" == -* ]]; then
            alias="$(gh api /repos/merlin-pinpin-org/kingdoms/contents/CONTRIBUTORS.md --jq .content | base64 -d | grep -F "| @${COMMENTER} |" | head -1 | awk -F"|" "{print \$3}" | tr -d " ")"
            [[ -n "$alias" ]] || { echo "::error::requestor has no roster entry — cannot resolve the default env; pass an explicit env (e.g. /${command#/} test)" >&2; exit 1; }
            env_name="${alias,,}"
          fi
          # Each command maps to one roster capability (CONTRIBUTORS.md
          # authority matrix): the routing and the gate share this mapping.
          case "${command#/}" in
            logs)    capability=env-logs ;;
            restart|start|stop) capability=env-control ;;
            status)  capability=env-control ;;
            rollback) capability=rollback ;;
            dump-db)  capability=db-dump ;;
            reset-env) capability=env-reset ;;
            seed)      capability=env-control ;;
          esac
          {
            echo "command=${command#/}"
            echo "environment=$env_name"
            echo "capability=$capability"
          } >> "$GITHUB_OUTPUT"

      - name: Acknowledge (what, why — before the gate, per the conventions)
        id: ack
        uses: actions/github-script@v7
        with:
          script: |
            const cmd = "${{ steps.parse.outputs.command }}";
            const env = "${{ steps.parse.outputs.environment }}";
            const body = {
              logs: `**/${cmd} intercepted** — collecting the ${env} logs and posting them back here (read-only: no deploy, no state change). Checking the roster authority matrix for **@${context.payload.comment.user.login}** (capability \`env-logs\`) — verdict right away.`,
              restart: `**/${cmd} intercepted** — restarting the ${env} stack in place (no pull, no recreate, no state change). Checking the roster authority matrix for **@${context.payload.comment.user.login}** (capability \`env-control\`) — verdict right away.`,
              start: `**/${cmd} intercepted** — starting the ${env} stack in place (no pull, no recreate, no state change). Checking the roster authority matrix for **@${context.payload.comment.user.login}** (capability \`env-control\`) — verdict right away.`,
              stop: `**/${cmd} intercepted** — stopping the ${env} stack in place (containers kept, no state change). Checking the roster authority matrix for **@${context.payload.comment.user.login}** (capability \`env-control\`) — verdict right away.`,
              status: `**/${cmd} intercepted** — reporting the ${env} stack state back here (read-only: no deploy, no state change). Checking the roster authority matrix for **@${context.payload.comment.user.login}** (capability \`env-control\`) — verdict right away.`,
              rollback: `**/${cmd} intercepted** — reverting the last pinned image on deploy/${env} (the push re-triggers the deployment of the previous known-good image). Checking the roster authority matrix for **@${context.payload.comment.user.login}** (capability \`rollback\`) — verdict right away.`,
              "dump-db": `**/${cmd} intercepted** — dumping the ${env} databases (mongodump + Redis snapshot), archived on the VPS and uploaded as a private artifact. Checking the roster authority matrix for **@${context.payload.comment.user.login}** (capability \`db-dump\`) — verdict right away.`,
              "reset-env": `**/${cmd} intercepted** — wiping the ${env} data volumes and reseeding from the workflow datasets (destructive: the env's data is lost). Checking the roster authority matrix for **@${context.payload.comment.user.login}** (capability \`env-reset\`: self env only, ops anywhere) — verdict right away.`,
              "seed": `**/${cmd} intercepted** — seeding the ${env} data from the requested source file (idempotent: re-running is safe). Checking the roster authority matrix for **@${context.payload.comment.user.login}** (capability \`env-control\`) — verdict right away.`,
            }[cmd];
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });


  # A reusable workflow can only be called at the job level (a job with
  # `uses:` cannot mix in `steps:`) — the roster gate is its own job
  # between the parse/ack job and the dispatch job.
  gate:
    name: Roster gate
    needs: authorize
    uses: merlin-pinpin-org/kingdoms/.github/workflows/authorize.yml@main
    with:
      capability: ${{ needs.authorize.outputs.capability }}
      environment: ${{ needs.authorize.outputs.environment }}
      requestor: ${{ github.event.comment.user.login }}
      pr-number: ${{ github.event.issue.number }}

  execute:
    name: Dispatch to kingdoms-infra
    needs: [authorize, gate]
    runs-on: ubuntu-latest
    outputs:
      workflow: ${{ steps.route.outputs.workflow }}
    steps:
      - name: Mint the kingdoms-deployer App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.KINGDOMS_DEPLOYER_APP_ID }}
          private-key: ${{ secrets.KINGDOMS_DEPLOYER_APP_PRIVATE_KEY }}
          owner: merlin-pinpin-org
          repositories: kingdoms-infra

      - name: Route the command
        id: dispatch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMAND: ${{ needs.authorize.outputs.command }}
          ENVIRONMENT: ${{ needs.authorize.outputs.environment }}
          REQUESTOR: ${{ github.event.comment.user.login }}
          THREAD: ${{ github.event.issue.number }}
        run: |
          case "$COMMAND" in
            logs)
              # /logs [env] [--service S] [--since 30m] [--from iso] [--to iso] [--tail N]
              # The env-logs job declares the GitHub environment <env> (its
              # secrets carry DISCORD_TOKEN), so the deployment branch policy
              # applies: dispatch on the state branch deploy/<env>, like every
              # other environment job, and forward the filter tokens as inputs.
              SERVICE="$(echo "$COMMENT_BODY" | grep -oP '(?<=--service )\S+' || true)"
              SINCE="$(echo "$COMMENT_BODY" | grep -oP '(?<=--since )\S+' || true)"
              FROM="$(echo "$COMMENT_BODY" | grep -oP '(?<=--from )\S+' || true)"
              TO="$(echo "$COMMENT_BODY" | grep -oP '(?<=--to )\S+' || true)"
              TAIL="$(echo "$COMMENT_BODY" | grep -oP '(?<=--tail )\S+' || true)"
              ARGS=(--repo merlin-pinpin-org/kingdoms-infra --ref "deploy/$ENVIRONMENT" -f environment="$ENVIRONMENT")
              [[ -n "$SERVICE" ]] && ARGS+=(-f service="$SERVICE")
              [[ -n "$SINCE" ]]   && ARGS+=(-f since="$SINCE")
              [[ -n "$FROM" ]]    && ARGS+=(-f from="$FROM")
              [[ -n "$TO" ]]      && ARGS+=(-f to="$TO")
              [[ -n "$TAIL" ]]    && ARGS+=(-f tail="$TAIL")
              gh workflow run env-logs.yml "${ARGS[@]}"
              ;;
            restart|start|stop|status)
              # env-control is workflow_dispatch-only (two choice lists);
              # reuse it through gh workflow run with its own inputs.
              # Dispatch on the state branch deploy/<env>: the job targets
              # the GitHub environment <env>, whose deployment branch policy
              # only allows deploy/<env> — a dispatch from main is rejected
              # by the environment protection.
              gh workflow run env-control.yml \
                --repo merlin-pinpin-org/kingdoms-infra \
                --ref "deploy/$ENVIRONMENT" \
                -f command="$COMMAND" \
                -f environment="$ENVIRONMENT"
              ;;
            reset-env)
              # Destructive: gated by the env-reset capability (self env
              # only, ops anywhere) in the roster matrix; env-control's
              # reset command does the wipe + reseed on the env's runner.
              gh workflow run env-control.yml \
                --repo merlin-pinpin-org/kingdoms-infra \
                --ref "deploy/$ENVIRONMENT" \
                -f command=reset \
                -f environment="$ENVIRONMENT"
              ;;
            seed)
              # /seed <env> <type> [file] [ladder_id|guild_id] — idempotent data
              # seeding through the env's kingdoms-core container
              # (kingdoms-infra env-seed.yml). Same env-control capability
              # as restart: seeding is additive, never destructive.
              # matches takes the target test guild id (guild-scoped,
              # fail-closed in env-seed.yml against the env's TEST_GUILD_ID);
              # season/test-season take the ladder id / owner_ref.
              SEED_TYPE="$(echo "$COMMENT_BODY" | awk '{print $3}')"
              SEED_FILE="$(echo "$COMMENT_BODY" | awk '{print $4}')"
              [[ -n "$SEED_TYPE" ]] || { echo "::error::usage: /seed <env> <users|matches|season|test-season> [file] [ladder_id|guild_id]" >&2; exit 1; }
              ARGS=(--repo merlin-pinpin-org/kingdoms-infra --ref "deploy/$ENVIRONMENT" -f environment="$ENVIRONMENT" -f type="$SEED_TYPE")
              [[ -n "$SEED_FILE" ]] && ARGS+=(-f file="$SEED_FILE")
              LAST_ARG="$(echo "$COMMENT_BODY" | awk '{print $5}')"
              [[ -n "$LAST_ARG" ]] && ARGS+=(-f "$([[ "$SEED_TYPE" == "matches" ]] && echo guild_id || echo ladder_id)"="$LAST_ARG")
              gh workflow run env-seed.yml "${ARGS[@]}"
              ;;
            rollback)
              gh api --method POST repos/merlin-pinpin-org/kingdoms-infra/dispatches \
                -f event_type=rollback-state \
                -f 'client_payload[env]='"$ENVIRONMENT" \
                -f 'client_payload[reason]="/'"$COMMAND"' requested by '"$REQUESTOR"' on #'"$THREAD" \
                -f 'client_payload[requestor]='"$REQUESTOR"
              ;;
            dump-db)
              gh workflow run db-daily-dump.yml \
                --repo merlin-pinpin-org/kingdoms-infra \
                -f environment="$ENVIRONMENT"
              ;;
          esac
      - name: Record the dispatched workflow for the reporter
        id: route
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          COMMAND: ${{ needs.authorize.outputs.command }}
        run: |
          case "$COMMAND" in
            logs)          WF="env-logs.yml" ;;
            restart|start|stop|status) WF="env-control.yml" ;;
            dump-db)       WF="db-daily-dump.yml" ;;
            *)             WF="" ;;
          esac
          echo "workflow=${WF}" >> "$GITHUB_OUTPUT"
  report:
    name: Report the result back on the PR
    needs: [authorize, gate, execute]
    if: needs.execute.outputs.workflow != ''
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    outputs:
      run_url: ${{ steps.wait.outputs.run_url }}
      conclusion: ${{ steps.wait.outputs.conclusion }}
    steps:
      - name: Mint the kingdoms-deployer App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.KINGDOMS_DEPLOYER_APP_ID }}
          private-key: ${{ secrets.KINGDOMS_DEPLOYER_APP_PRIVATE_KEY }}
          owner: merlin-pinpin-org
          repositories: kingdoms-infra
      - name: Wait for the environment workflow to finish
        id: wait
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          WF: ${{ needs.execute.outputs.workflow }}
          ENVIRONMENT: ${{ needs.authorize.outputs.environment }}
          SINCE: ${{ github.event.comment.created_at }}
        run: |
          since="${SINCE}"
          deadline=$(( SECONDS + 600 ))
          run_id=""
          while (( SECONDS < deadline )); do
            run_id="$(gh run list --repo merlin-pinpin-org/kingdoms-infra \
              --workflow "$WF" --branch "deploy/$ENVIRONMENT" --limit 5 \
              --json databaseId,status,conclusion,createdAt \
              --jq "[.[] | select(.createdAt >= \"$since\")] | .[0] // empty" || true)"
            [[ -n "$run_id" ]] && break
            sleep 10
          done
          [[ -n "$run_id" ]] || { echo "conclusion=not_found" >> "$GITHUB_OUTPUT"; exit 0; }
          rid="$(echo "$run_id" | python3 -c 'import json,sys; print(json.load(sys.stdin)["databaseId"])')"
          gh run watch "$rid" --repo merlin-pinpin-org/kingdoms-infra --exit-status > /dev/null 2>&1 || true
          conclusion="$(gh run view "$rid" --repo merlin-pinpin-org/kingdoms-infra --json conclusion --jq .conclusion)"
          {
            echo "run_url=https://github.com/merlin-pinpin-org/kingdoms-infra/actions/runs/$rid"
            echo "run_id=$rid"
            echo "conclusion=$conclusion"
          } >> "$GITHUB_OUTPUT"
      - name: Collect the result payload (logs excerpt or control dump)
        id: payload
        if: steps.wait.outputs.conclusion != '' && steps.wait.outputs.conclusion != 'not_found'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          COMMAND: ${{ needs.authorize.outputs.command }}
          RUN_ID: ${{ steps.wait.outputs.run_id }}
          ENVIRONMENT: ${{ needs.authorize.outputs.environment }}
        run: |
          if [[ "$COMMAND" == "logs" ]]; then
            artifact_name="$(gh api "repos/merlin-pinpin-org/kingdoms-infra/actions/runs/$RUN_ID/artifacts" --jq '.artifacts[0].name' 2>/dev/null || true)"
            if [[ -n "$artifact_name" ]]; then
              mkdir -p /tmp/envlogs && cd /tmp/envlogs
              artifact_id="$(gh api "repos/merlin-pinpin-org/kingdoms-infra/actions/runs/$RUN_ID/artifacts" --jq '.artifacts[0].id')"
              gh api "repos/merlin-pinpin-org/kingdoms-infra/actions/artifacts/$artifact_id/zip" > artifact.zip
              unzip -o artifact.zip logs.txt >/dev/null
              {
                echo '```'
                tail -n 40 logs.txt
                echo '```'
              } > excerpt.txt
              {
                echo "excerpt<<EOF"
                cat excerpt.txt
                echo "EOF"
              } >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Post the result on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          COMMAND: ${{ needs.authorize.outputs.command }}
          ENVIRONMENT: ${{ needs.authorize.outputs.environment }}
          ALIAS: ${{ needs.gate.outputs.alias }}
          RUN_URL: ${{ steps.wait.outputs.run_url }}
          CONCLUSION: ${{ steps.wait.outputs.conclusion }}
          EXCERPT: ${{ steps.payload.outputs.excerpt }}
          THREAD: ${{ github.event.issue.number }}
        run: |
          icon="✅"; [[ "$CONCLUSION" == "success" ]] || icon="❌"
          if [[ "$CONCLUSION" == "not_found" ]]; then
            {
              echo "⚠️ /$COMMAND on $ENVIRONMENT — dispatched but the run could not be located."
              echo "Check kingdoms-infra actions for workflow $RUN_URL."
            } > /tmp/report.md
          else
            {
              echo "$icon **/$COMMAND on $ENVIRONMENT** — $CONCLUSION."
              echo "Full run: $RUN_URL"
              if [[ "$COMMAND" == "logs" && -n "$EXCERPT" ]]; then
                echo ""
                echo "Last lines (full dump in the run's private artifact):"
                printf '%s\n' "$EXCERPT"
              fi
            } > /tmp/report.md
          fi
          if gh pr view "$THREAD" --repo merlin-pinpin-org/kingdoms-services >/dev/null 2>&1; then
            gh pr comment "$THREAD" --repo merlin-pinpin-org/kingdoms-services --body-file /tmp/report.md
          else
            gh issue comment "$THREAD" --repo merlin-pinpin-org/kingdoms-services --body-file /tmp/report.md
          fi
