name: Vibe pydoc (temporary)
# Temporary pydoc generator pushed by the Vibe session: it regenerates the
# pydoc tree with the real locked toolchain (pydantic rendering) and commits
# the fresh pages back to this branch. This file is removed once the pages
# are committed — the same proven method as the phase 1.2 tranche ① session.

on:
  push:
    branches: [feature/214-royaume-panel-2]

permissions:
  contents: write

jobs:
  pydoc:
    name: Regenerate and commit the pydoc tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12.14"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Regenerate the pydoc pages
        run: |
          python .github/workflows/scripts/generate_pydoc.py \
            --source src/kingdoms \
            --output docs/DEVELOPMENT/pydoc
      - name: Commit the fresh pydoc
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/DEVELOPMENT/pydoc
          git commit -m "docs(pydoc): regenerate with the locked toolchain" || echo "no pydoc changes"
          git push
