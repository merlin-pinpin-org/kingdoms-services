name: Debug check73 (temporary)

on:
  push:
    branches: [vibe/drasah/main]

permissions:
  pull-requests: write
  contents: read

jobs:
  debug:
    name: Debug outputs (temporary)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Run ruff, mypy, pytest (never fail)
        run: |
          uv sync
          { uv run ruff check src/ tests/; echo "EXIT:$?"; } > /tmp/ruff.log 2>&1 || true
          { uv run mypy src/; echo "EXIT:$?"; } > /tmp/mypy.log 2>&1 || true
          { uv run pytest -q --no-header -p no:cacheprovider; echo "EXIT:$?"; } > /tmp/pytest.log 2>&1 || true
          wc -c /tmp/ruff.log /tmp/mypy.log /tmp/pytest.log
      - name: Post the outputs on PR 244
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## Debug check73 outputs"
            echo '<details><summary>ruff</summary>'
            echo '```'
            tail -c 6000 /tmp/ruff.log
            echo '```'
            echo '</details>'
            echo '<details><summary>mypy</summary>'
            echo '```'
            tail -c 6000 /tmp/mypy.log
            echo '```'
            echo '</details>'
            echo '<details><summary>pytest</summary>'
            echo '```'
            tail -c 20000 /tmp/pytest.log
            echo '```'
            echo '</details>'
          } > /tmp/body.md
          gh pr comment 244 --repo "$GITHUB_REPOSITORY" --body-file /tmp/body.md
