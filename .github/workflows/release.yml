# Promote a validated release to production (ADR-0018).
#
# A released vX.Y.Z image is never deployed to prod directly: the tag push
# pins it on deploy/test first (the Docker workflow), where the humans
# validate the release in Discord. Once validated, an authorized human
# triggers this workflow (workflow_dispatch) — the tag input is validated
# against the existing git tags, and the pin is dispatched to the
# kingdoms-infra Pin state workflow for the prod environment.
#
# Gating:
# - only users with write access can run a workflow_dispatch on main
#   (collaborators);
# - the prod GitHub environment carries the required reviewers (the
#   Deploy environment run waits for their approval before deploying);
# - the pin is written by the kingdoms-deployer App (bypass on the
#   deploy/prod state-branch ruleset, single-writer design).
name: Promote release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Released tag to promote to prod (vX.Y.Z)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  promote:
    name: Pin the released image on deploy/prod
    runs-on: ubuntu-latest
    steps:
      - name: Validate the tag input
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG}"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$tag' is not a release tag (expected vX.Y.Z, classifiers allowed)"
            exit 1
          fi
          if ! git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${tag}" | grep -q .; then
            echo "::error::tag '$tag' does not exist on this repository — release it first (push the tag; the Docker workflow pins it on deploy/test)"
            exit 1
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - name: Mint an ephemeral GitHub App token for kingdoms-infra
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.KINGDOMS_DEPLOYER_APP_ID }}
          private-key: ${{ secrets.KINGDOMS_DEPLOYER_APP_PRIVATE_KEY }}
          owner: merlin-pinpin-org
          repositories: kingdoms-infra

      - name: Pin the released image on deploy/prod (ADR-0018)
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const tag = process.env.TAG;
            const image = `ghcr.io/merlin-pinpin-org/kingdoms-services:${tag}`;
            const releaseUrl = `https://github.com/merlin-pinpin-org/kingdoms-services/releases/tag/${tag}`;
            await github.rest.repos.createDispatchEvent({
              owner: "merlin-pinpin-org",
              repo: "kingdoms-infra",
              event_type: "pin-state",
              client_payload: {
                env: "prod",
                image,
                version_label: tag,
                deploy_url: releaseUrl,
                deploy_kind: "release",
                deploy_ref: tag,
                deploy_tree_url: `https://github.com/merlin-pinpin-org/kingdoms-services/tree/${tag}`,
                deploy_branch: "main",
                deploy_pr_title: "",
                deployed_by: `${context.actor} (promote ${tag})`,
              },
            });
            core.notice(`pin-state dispatched for ${image} on deploy/prod`);

      - name: Watch the kingdoms-infra deploy run
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const infraOwner = "merlin-pinpin-org", infraRepo = "kingdoms-infra";
            const tag = process.env.TAG;
            // The pin commit message carries the version label (the tag) —
            // match on it to recover the state commit the deploy run carries.
            const findDeadline = Date.now() + 30 * 60 * 1000;
            let stateCommit = null;
            while (Date.now() < findDeadline && !stateCommit) {
              const { data: commits } = await github.rest.repos.listCommits({
                owner: infraOwner, repo: infraRepo,
                sha: "deploy/prod",
                path: "envs/prod/state/kingdoms-bot.yml",
                per_page: 10,
              });
              stateCommit = commits.find((c) => c.commit.message.includes(tag)) || null;
              core.info(`pin commit on deploy/prod: ${stateCommit ? stateCommit.sha : "not landed yet"}`);
              if (!stateCommit) await new Promise((r) => setTimeout(r, 20000));
            }
            if (!stateCommit) {
              core.setFailed(`the pin never landed on deploy/prod (30 min deadline) — check the kingdoms-infra Pin state workflow run`);
              return;
            }
            const stateSha = stateCommit.sha;
            const deadline = Date.now() + 15 * 60 * 1000;
            let run = null;
            while (Date.now() < deadline) {
              const { data: { workflow_runs: runs } } = await github.rest.actions.listWorkflowRuns({
                owner: infraOwner, repo: infraRepo, workflow_id: "deploy.yml", branch: "deploy/prod", per_page: 5,
              });
              run = runs.find((r) => r.head_sha === stateSha) || null;
              core.info(`infra deploy run: ${run ? run.html_url + " (" + run.status + ")" : "not started yet"}`);
              if (run && run.status === "completed") break;
              await new Promise((r) => setTimeout(r, 20000));
            }
            if (!run) core.setFailed("the kingdoms-infra deploy run for the pinned state commit never started (15 min deadline)");
            const runUrl = run ? run.html_url : `${context.serverUrl}/${infraOwner}/${infraRepo}/actions`;
            const ok = run && run.conclusion === "success";
            if (!ok) core.setFailed(`the kingdoms-infra deploy run did not succeed: ${runUrl}`);
            core.notice(`prod deploy finished: ${runUrl}`);
