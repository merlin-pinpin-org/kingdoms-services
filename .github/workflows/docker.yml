name: Docker

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

# The push of a vX.Y.Z tag releases the image and pins it on the
# kingdoms-infra deploy/test state branch (deploy_kind: release): the
# release is validated on the test environment before any prod deploy.
# Production promotion is a separate, human-triggered step (release.yml)
# — after Discord validation on test, an authorized human runs it.
# PR builds never pin anything.

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and test the image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the multi-stage image (load)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: kingdoms-bot:pr
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Inspect the image (entrypoint, user, layers)
        run: |
          docker image inspect kingdoms-bot:pr --format 'Entrypoint: {{json .Config.Entrypoint}} User: {{json .Config.User}}'
          test "$(docker image inspect kingdoms-bot:pr --format '{{.Config.User}}')" = "65534:65534"
          test "$(docker history kingdoms-bot:pr --format '{{.Size}}' | wc -l)" -ge 3

      - name: Smoke test the image (with MongoDB and Redis)
        run: |
          docker network create kingdoms-ci
          docker run -d --name kingdoms-mongo --network kingdoms-ci mongo:7.0
          docker run -d --name kingdoms-redis --network kingdoms-ci redis:7.2
          timeout 60 bash -c 'until docker exec kingdoms-mongo mongosh --quiet --eval "db.adminCommand(\"ping\")" | grep -q ok; do sleep 2; done'
          timeout 60 bash -c 'until docker exec kingdoms-redis redis-cli ping | grep -q PONG; do sleep 2; done'

          cat > /tmp/kingdoms-smoke.py <<'PY'
          import os
          import pymongo
          import redis

          client = pymongo.MongoClient(os.environ["MONGO_URI"], serverSelectionTimeoutMS=5000)
          assert client.admin.command("ping")["ok"] == 1, "MongoDB ping failed"
          r = redis.Redis.from_url(os.environ["REDIS_URI"], socket_connect_timeout=5)
          assert r.ping() is True, "Redis ping failed"
          import kingdoms
          print(f"kingdoms imports OK: {kingdoms.__version__}")
          print("SMOKE OK")
          PY

          docker run --rm --network kingdoms-ci \
            -e MONGO_URI=mongodb://kingdoms-mongo:27017 \
            -e REDIS_URI=redis://kingdoms-redis:6379 \
            -e DISCORD_TOKEN=dummy-token-for-smoke \
            -v /tmp/kingdoms-smoke.py:/smoke.py:ro \
            --entrypoint /bin/bash \
            kingdoms-bot:pr -c 'python /smoke.py'

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        if: github.event_name == 'push'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - name: Push the image to GHCR
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Cleanup
        if: always()
        run: |
          docker rm -f kingdoms-mongo kingdoms-redis 2>/dev/null || true
          docker network rm kingdoms-ci 2>/dev/null || true

  pin-release-test:
    name: Pin the released image on deploy/test
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Mint an ephemeral GitHub App token for kingdoms-infra
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.KINGDOMS_DEPLOYER_APP_ID }}
          private-key: ${{ secrets.KINGDOMS_DEPLOYER_APP_PRIVATE_KEY }}
          owner: merlin-pinpin-org
          repositories: kingdoms-infra

      - name: Pin the released image on deploy/test (ADR-0018)
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const tag = context.ref.replace("refs/tags/", "");
            const image = `ghcr.io/merlin-pinpin-org/kingdoms-services:${tag}`;
            // The GitHub release page for the tag (created or not yet);
            // /status renders it as the Release link.
            const releaseUrl = `https://github.com/merlin-pinpin-org/kingdoms-services/releases/tag/${tag}`;
            await github.rest.repos.createDispatchEvent({
              owner: "merlin-pinpin-org",
              repo: "kingdoms-infra",
              event_type: "pin-state",
              client_payload: {
                env: "test",
                image,
                version_label: tag,
                deploy_url: releaseUrl,
                deploy_kind: "release",
                deploy_ref: tag,
                deploy_tree_url: `https://github.com/merlin-pinpin-org/kingdoms-services/tree/${tag}`,
                deploy_branch: "main",
                deploy_pr_title: "",
                deployed_by: `${context.actor} (release ${tag})`,
              },
            });
            core.notice(`pin-state dispatched for ${image} on deploy/test`);
