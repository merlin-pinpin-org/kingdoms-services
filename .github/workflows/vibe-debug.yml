name: debug
# Temporary diagnostics workflow (kingdoms#214 tranche ②-b): dumps
# ruff/mypy/pytest output into vibe-debug-ci.txt and refreshes the
# pydoc with the gate's exact command, then commits everything so the
# errors are readable from the branch without log access.

on:
  push:
    branches: [feature/214-admin-panel-roster]

permissions:
  contents: write

concurrency:
  group: debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    name: debug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Dump ruff / mypy / pytest diagnostics
        continue-on-error: true
        run: |
          uv sync || true
          {
            echo "===== ruff ====="
            uv run ruff check src/ tests/ || true
            echo "===== mypy ====="
            uv run mypy src/ || true
            echo "===== pytest ====="
            uv run pytest || true
          } > vibe-debug-ci.txt 2>&1 || true
      - name: Refresh the pydoc (gate command)
        continue-on-error: true
        run: |
          uv run python .github/workflows/scripts/generate_pydoc.py \
            --source src/kingdoms \
            --output /tmp/pydoc-fresh || true
          rm -rf docs/DEVELOPMENT/pydoc
          mkdir -p docs/DEVELOPMENT/pydoc
          cp -a /tmp/pydoc-fresh/. docs/DEVELOPMENT/pydoc/ 2>/dev/null || true
          touch docs/DEVELOPMENT/pydoc/.gitkeep
      - name: Commit diagnostics
        continue-on-error: true
        run: |
          git config user.name "kingdoms-ci-bot"
          git config user.email "kingdoms-ci-bot@users.noreply.github.com"
          git add vibe-debug-ci.txt docs/DEVELOPMENT/pydoc
          git commit -m "chore(docs): refresh pydoc + diagnostics (CI)" || echo "nothing to commit"
          git push
