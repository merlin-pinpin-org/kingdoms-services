name: vibe-debug
on:
  push:
    branches: [feature/214-admin-panel-saison]
permissions:
  contents: write
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12.14"
      - run: uv sync --frozen
      - name: Dump diagnostics
        continue-on-error: true
        run: |
          {
            echo "=== ruff ==="
            uv run ruff check src/ tests/ 2>&1 || true
            echo "=== mypy ==="
            uv run mypy src/ 2>&1 || true
            echo "=== pytest ==="
            uv run pytest -q 2>&1 || true
          } > vibe-debug-ci.txt
          exit 0
      - name: Refresh pydoc exactly as the freshness gate
        continue-on-error: true
        run: |
          uv run python .github/workflows/scripts/generate_pydoc.py \
            --source src/kingdoms \
            --output /tmp/pydoc-fresh
          rm -rf docs/DEVELOPMENT/pydoc
          cp -r /tmp/pydoc-fresh docs/DEVELOPMENT/pydoc
          touch docs/DEVELOPMENT/pydoc/.gitkeep
      - run: |
          git config user.name "kingdoms-ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add vibe-debug-ci.txt docs/DEVELOPMENT/pydoc
          git commit -m "chore(docs): refresh pydoc + diagnostics (CI)" || echo "no change"
          git push
