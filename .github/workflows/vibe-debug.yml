name: Vibe debug (temporary)
# Temporary self-diagnosis workflow pushed by the Vibe session: it runs the
# three failing gates with the real locked toolchain and commits the outputs
# (fresh pydoc, ruff and pytest logs) back to this branch so the failures can
# be inspected from outside. This file is removed once the gates pass.

on:
  push:
    branches: [feature/214-admin-socle]

permissions:
  contents: write

jobs:
  debug:
    name: Collect CI diagnostics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12.14"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Collect diagnostics
        run: |
          set +e
          uv run ruff check src/ tests/ > vibe-debug-ruff.txt 2>&1
          uv run pytest -q > vibe-debug-pytest.txt 2>&1
          python .github/workflows/scripts/generate_pydoc.py \
            --source src/kingdoms \
            --output docs/DEVELOPMENT/pydoc
          set -e
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vibe-debug-ruff.txt vibe-debug-pytest.txt docs/DEVELOPMENT/pydoc
          git commit -m "chore: temporary CI diagnostics output"
          git push
