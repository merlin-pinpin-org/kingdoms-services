name: vibe-debug
on:
  push:
    branches: [feature/214-admin-panel-saison]
permissions:
  contents: write
jobs:
  pydoc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: |
          uv run python .github/workflows/scripts/generate_pydoc.py \
            --output docs/DEVELOPMENT/pydoc
      - run: |
          git config user.name "kingdoms-ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add docs/DEVELOPMENT/pydoc
          git commit -m "chore(docs): refresh pydoc (CI)" || echo "no pydoc change"
          git push
