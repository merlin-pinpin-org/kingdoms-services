# Kingdoms mod (Season II territory-conquest AoE2).
# Design: kingdoms repo docs/MODS/kingdoms/ (reference Season II + DECISIONS.md D1-D54).
# Enabled with T2 (enrollment); the declaration is validated at startup.
#
# Single source of truth of the salons-first structure (kingdoms#138,
# kingdoms-services#175): the startup provisioning and the /kingdom
# bootstrap both provision from this declaration — channel groups
# (categories), kinds (text/forum/announce) and admin-only flags are
# data here, never code in the mod.
id: kingdoms
enabled: true
seasonal: true
settings: {}
channel_groups:
  - key: profiles
    display_name: 👤 ᴘʀᴏꜰɪʟs
  # restructuration-serveur-v1 e (Drasah 19/10): the general group is
  # GONE ENTIRELY (Taverne + the vocal) — nothing is kept or moved.
  - key: conscription
    display_name: ✒️ ᴄᴏɴsᴄʀɪᴘᴛɪᴏɴ
  # restructuration-gaia-v1 (Drasah 24/10): the Gaïa group RETIRES —
  # its Territoire salon moves into the Kingdoms category, which is
  # renamed « Kingdoms-Gaia »; the Taverne (taverne-v1) is born here.
  - key: kingdoms
    display_name: 🏰 ᴋɪɴɢᴅᴏᴍs-ɢᴀɪᴀ
  - key: battlefield
    display_name: ⚔️ ᴄʜᴀᴍᴘs ᴅᴇ ʙᴀᴛᴀɪʟʟᴇ
  - key: admin
    display_name: ⚙️ ᴀᴅᴍɪɴ
    admin_only: true
channels:
  # restructuration-serveur-v1 e (Drasah 19/10): the general group and
  # its Taverne are RETIRED — the category disappears at the next
  # provisioning (the legacy cleanup sweeps both).
  - key: apply
    display_name: 📝 postuler
    description: The enrollment panel channel
    group: conscription
  - key: applications
    display_name: 📥 candidatures
    description: Submitted applications (admin only)
    group: conscription
    admin_only: true
    access:
      everyone_view: false
      view: [Kingdoms Admin]
  - key: realms
    display_name: 👑 royaumes
    description: Kingdom validation panel (admin only)
    group: conscription
    admin_only: true
    access:
      everyone_view: false
      view: [Kingdoms Admin]
  - key: scriptorium
    display_name: 📜 scriptorium
    description: Sommaire — Cadastre, Diplomatie, Seigneurie (ephemeral rubrics)
    group: kingdoms
    # permissions-serveur-v1 (Drasah 19/10): a newcomer sees only
    # Conscription and Beta — every other salon denies @everyone and
    # unlocks through the player roles (granted at acceptance).
    access:
      everyone_view: false
      view: [Kingdoms Lord, Kingdoms King, Kingdoms Admin]
  - key: market
    # marche-emoji-v1 (Drasah 26/10): le nom reste « marché » — seul
    # l'emoji caddie 🛒 gênait ; 💰 le remplace. La bourse est le nom
    # de la monnaie, pas du salon. Même clé (renommage id-mappé au
    # prochain provisioning).
    display_name: 💰 marché
    description: The kingdom's market — techs and actions bought with écus
    group: kingdoms
    access:
      everyone_view: false
      view: [Kingdoms Lord, Kingdoms King, Kingdoms Admin]
  - key: geopolitics
    display_name: 🌍 géopolitique
    description: Announcements, treaties and political rules
    group: kingdoms
    # permissions-serveur-v1: the pinned age message lives here (the
    # dedicated 🏺 Âge salon is gone — its name now carries the age emoji).
    access:
      everyone_view: false
      view: [Kingdoms Lord, Kingdoms King, Kingdoms Admin]
  - key: territory
    display_name: 🗺️ territoire
    description: Territories and their cadastre effects — plus the Gaïa AI level (restructuration-serveur-v1 c, Drasah 19/10)
    # restructuration-gaia-v1 (Drasah 24/10): moved from the retired
    # gaia group into kingdoms (Kingdoms-Gaia).
    group: kingdoms
    access:
      everyone_view: false
      view: [Kingdoms Lord, Kingdoms King, Kingdoms Admin]
  - key: tavern
    display_name: 🍺 taverne
    description: The lords' tavern — drinks, rumors, bets and the Mercenary Chief (taverne-v1)
    group: kingdoms
    access:
      everyone_view: false
      view: [Kingdoms Lord, Kingdoms King, Kingdoms Admin]
  - key: attack
    display_name: ⚔️ déclarer une attaque
    description: The guided attack declaration panel
    group: battlefield
    access:
      everyone_view: false
      view: [Kingdoms Lord, Kingdoms King, Kingdoms Admin]
  - key: talks
    display_name: 🕊️ pourparlers
    description: War negotiations
    group: battlefield
    access:
      everyone_view: false
      view: [Kingdoms Lord, Kingdoms King, Kingdoms Admin]
      post: [Kingdoms Lord, Kingdoms King, Kingdoms Admin]
  - key: settings
    display_name: ⚙️ paramètres
    description: Mod settings panel channel
    group: admin
    # permissions-serveur-v1: the admin category and its salons are
    # admin-only — an explicit access block keeps the provisioning's
    # policy application from re-granting @everyone view (the default
    # policy is everyone_view: true).
    access:
      everyone_view: false
      view: [Kingdoms Admin]
  # saison-removal-v1 (Drasah 27/10): the 🗓️ gestion saison salon is
  # GONE — nothing in the mod ever targeted it (no panel, no command);
  # the live salon is swept as a legacy slug at the next provisioning.
  - key: time_machine
    display_name: ⏱️ machine à temps
    description: Game-clock test panel — fast-forward and snapshots (admin only)
    group: admin
    admin_only: true
    access:
      everyone_view: false
      view: [Kingdoms Admin]
  - key: distributor
    display_name: 🎁 distributeur
    description: Admin test injector — hand elements to a kingdom (admin only)
    group: admin
    admin_only: true
    access:
      everyone_view: false
      view: [Kingdoms Admin]
  # console-removal-v1 (Drasah 25/10): the console channel block is
  # GONE — the listener never booted in prod; the live flows live on
  # the ⚙️ Paramètres panel and the salon is swept as a legacy slug.
  - key: requests
    display_name: 📬 demandes
    description: Edit/leave requests (admin only)
    group: admin
    access:
      everyone_view: false
      view: [Kingdoms Admin]
  # admin-logs-v1 (Drasah 30/10): the destructive admin actions land in
  # 📜 journal-admin — a timestamped trail (ejection, reking, validation).
  - key: admin_log
    display_name: 📜 journal-admin
    description: Timestamped admin actions log (admin only)
    group: admin
    admin_only: true
    access:
      everyone_view: false
      view: [Kingdoms Admin]
  # ordre-salons-v1 (Drasah 19/10): the Support group (question /
  # signaler-un-bug forums) is RETIRED — it read as a duplicate of the
  # admin salons; the anonymous Pigeon already handles a missing
  # question salon gracefully. Both slugs join LEGACY_SALON_SLUGS.
roles:
  - key: kingdoms_king
    display_name: Kingdoms King
    color: 0xE6B800
    hoisted: true
  - key: kingdoms_lord
    display_name: Kingdoms Lord
    color: 0x3498DB
  - key: kingdoms_locked
    display_name: 💍 Verrouillé
    color: 0xE74C3C
  - key: kingdoms_admin
    display_name: Kingdoms Admin
    color: 0xE74C3C
    hoisted: true
workflows: []
commands: []
dependencies: []
