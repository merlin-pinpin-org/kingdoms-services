# Kingdoms mod (Season II territory-conquest AoE2).
# Design: kingdoms repo docs/MODS/kingdoms/ (reference Season II + DECISIONS.md D1-D54).
# Enabled with T2 (enrollment); the declaration is validated at startup.
#
# Single source of truth of the mod's channels (kingdoms#138):
# the startup provisioning and the /kingdom bootstrap both provision
# from this declaration.
