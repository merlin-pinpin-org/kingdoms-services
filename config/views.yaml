views:
  menu:home:
    kind: menu
    scope: root/general
    buttons:
    - target: panel:profile
      label: ui.homes.btn_profile
      emoji: 👤
    - target: menu:games:home
      label: ui.homes.btn_games
      emoji: 🎮
    - target: menu:mods:home
      label: ui.homes.btn_mods
      emoji: 🧩
    - target: menu:admin
      label: ui.homes.btn_admin
      admin: true
  panel:profile:
    kind: panel
  menu:admin:
    kind: menu
    scope: bot/admin
    buttons:
    - target: panel:status
      label: ui.homes.btn_status
      emoji: 📊
    - target: menu:games:admin
      label: ui.homes.btn_games
      emoji: 🎮
    - target: menu:mods:admin
      label: ui.homes.btn_mods
      emoji: 🧩
    - label: ui.homes.btn_sync
      sync: true
    title_emoji: 🔓
  panel:status:
    kind: panel
  menu:games:home:
    kind: menu
    scope: games/general
    buttons:
    - target: menu:games:aoe2
      label: ui.games.homes.aoe2
      emoji: ⚔️
    - target: menu:games:admin
      label: ui.homes.btn_admin
      admin: true
  menu:games:admin:
    kind: menu
    scope: games/admin
    buttons:
    - target: menu:game:aoe2:admin
      label: ui.games.homes.aoe2
      emoji: ⚔️
    - label: ui.homes.btn_sync
      sync: true
    title_emoji: 🔓
  menu:games:aoe2:
    kind: menu
    scope: games/aoe2/general
    buttons:
    - target: panel:game:aoe2:live
      label: ui.homes.btn_live
      emoji: 📡
    - target: panel:game:aoe2:players
      label: ui.homes.btn_users
      emoji: 👥
    - target: menu:game:aoe2:admin
      label: ui.homes.btn_admin
      admin: true
  menu:game:aoe2:admin:
    kind: menu
    scope: games/aoe2/admin
    buttons:
    - label: ui.homes.btn_add_map
      action: import-map
      emoji: 🌟
    - label: ui.games.bulk_import_map
      action: bulk-import-map
      emoji: 📚
    - label: ui.homes.btn_create_pool
      action: create-pool
      emoji: 🧱
    - label: ui.homes.btn_sync
      sync: true
    title_emoji: 🔓
  panel:game:aoe2:live:
    kind: panel
  panel:game:aoe2:players:
    kind: panel
  menu:mods:home:
    kind: menu
    scope: mods/general
    buttons:
    - target: menu:mod:ladder
      label: ui.mods.homes.ladder
      disabled: true
      emoji: 🏆
    - target: menu:mod:tournament
      label: ui.mods.homes.tournament
      disabled: true
      emoji: 🎯
    - target: menu:mod:kingdom
      label: ui.mods.homes.kingdom
      disabled: true
      emoji: 👑
    - target: menu:mods:admin
      label: ui.homes.btn_admin
      admin: true
  menu:mods:admin:
    kind: menu
    scope: mods/admin
    buttons:
    - target: menu:mod:ladder:admin
      label: ui.mods.homes.ladder
      disabled: true
    - target: menu:mod:tournament:admin
      label: ui.mods.homes.tournament
      disabled: true
    - target: menu:mod:kingdom:admin
      label: ui.mods.homes.kingdom
      disabled: true
    - label: ui.homes.btn_sync
      sync: true
    title_emoji: 🔓
  menu:mod:ladder:
    kind: menu
  menu:mod:tournament:
    kind: menu
  menu:mod:kingdom:
    kind: menu
  menu:mod:ladder:admin:
    kind: menu
  menu:mod:tournament:admin:
    kind: menu
  menu:mod:kingdom:admin:
    kind: menu
scopes:
  root:
    channels:
    - key: general
      label: ui.panels.channels.general
      kind: text
      access: readonly
      description: 'l''accueil : le menu du serveur, chaque bouton ouvre une vue'
    - key: discussions
      label: ui.panels.channels.discussions
      kind: text
      access: public
      description: les discussions libres du serveur
  bot:
    category: ui.panels.categories.bot
    channels:
    - key: logs
      label: ui.panels.channels.logs
      kind: text
      access: admin
      description: 'le journal du bot : démarrages, déploiements, erreurs'
    - key: admin
      label: ui.panels.channels.admin
      kind: text
      access: admin
      description: 'le poste de pilotage : le menu d''administration épinglé'
    - key: decisions
      label: ui.panels.channels.decisions
      kind: text
      access: admin
      description: les décisions d'exploitation du serveur
  games:
    category: ui.panels.categories.games
    channels:
    - key: general
      label: ui.panels.channels.general
      kind: text
      access: readonly
      description: 'l''accueil des jeux : le menu et les nouvelles'
    - key: admin
      label: ui.panels.channels.admin
      kind: text
      access: admin
      description: l'administration des jeux du serveur
  games/aoe2:
    category: ui.panels.categories.games_aoe2
    channels:
    - key: general
      label: ui.panels.channels.general
      kind: text
      access: readonly
      description: 'l''accueil d''Age of Empires II : le menu du jeu'
    - key: live
      label: ui.panels.channels.live
      kind: text
      access: readonly
      description: qui joue en direct, rafraîchi en continu
    - key: civs
      label: ui.panels.channels.civs
      kind: forum
      access: readonly
      description: 'une fiche par civilisation : bonus, unités, arbres technologiques'
    - key: maps
      label: ui.panels.channels.maps
      kind: forum
      access: readonly
      description: 'une fiche par carte : image, description, pools'
    - key: map-pools
      label: ui.panels.channels.map_pools
      kind: forum
      access: readonly
      description: 'une fiche par map pool : composition et état'
    - key: admin
      label: ui.panels.channels.admin
      kind: text
      access: admin
      description: 'l''administration d''Age of Empires II : maps, pools, sync'
  mods:
    category: ui.panels.categories.mods
    channels:
    - key: general
      label: ui.panels.channels.general
      kind: text
      access: readonly
      description: 'l''accueil des mods : le menu et les mods disponibles'
    - key: admin
      label: ui.panels.channels.admin
      kind: text
      access: admin
      description: l'administration des mods du serveur
