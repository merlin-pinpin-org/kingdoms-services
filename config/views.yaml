views:
  menu:home:
    kind: menu
    scope: root/general
    buttons:
    - target: panel:profile
      label: ui.homes.btn_profile
      emoji: 👤
    - target: menu:games:home
      label: ui.homes.btn_games
      emoji: 🎮
    - target: menu:mods:home
      label: ui.homes.btn_mods
      emoji: 🧩
    - target: menu:admin
      label: ui.homes.btn_admin
      admin: true
  panel:profile:
    kind: panel
  menu:admin:
    kind: menu
    scope: bot/admin
    buttons:
    - target: ''
      label: ui.homes.btn_language
      action: set-language
      emoji: 🌐
    - target: panel:status
      label: ui.homes.btn_status
      emoji: 📊
    - target: menu:games:admin
      label: ui.homes.btn_games
      emoji: 🎮
    - target: menu:mods:admin
      label: ui.homes.btn_mods
      emoji: 🧩
    - label: ui.homes.btn_sync
      sync: true
    admin_surface: true
  menu:console:
    kind: menu
    scope: bot/admin
    buttons: []
    admin_surface: true
  panel:status:
    kind: panel
  menu:games:home:
    kind: menu
    scope: games/general
    buttons:
    - target: menu:games:admin
      label: ui.homes.btn_admin
      admin: true
  menu:games:admin:
    kind: menu
    scope: games/admin
    buttons:
    - label: ui.homes.btn_sync
      sync: true
    admin_surface: true
  menu:games:aoe2:
    kind: menu
    scope: games/aoe2/general
    buttons:
    - target: panel:game:aoe2:live
      label: ui.homes.btn_live
      emoji: 📡
    - target: panel:game:aoe2:players
      label: ui.homes.btn_users
      emoji: 👥
    # the GENERIC Profile button (#333/#363): the panel is game-agnostic
    # (the user's linked accounts; the game's details ride its enricher —
    # data, never code); every game menu declares the same target
    - target: panel:profile
      label: ui.homes.btn_profile
      emoji: 👤🏼
    - target: menu:game:aoe2:admin
      label: ui.homes.btn_admin
      admin: true
  menu:game:aoe2:admin:
    kind: menu
    scope: games/aoe2/admin
    buttons:
    - label: ui.homes.btn_add_map
      action: import-map
      emoji: 🗺️
    - label: ui.homes.btn_create_pool
      action: create-pool
      emoji: 🧱
    - label: ui.homes.btn_sync
      sync: true
    admin_surface: true
  panel:game:aoe2:live:
    kind: panel
  panel:game:aoe2:players:
    kind: panel
  menu:mods:home:
    kind: menu
    scope: mods/general
    buttons:
    - target: menu:mods:admin
      label: ui.homes.btn_admin
      admin: true

  menu:mods:admin:
    kind: menu
    scope: mods/admin
    admin_surface: true
    buttons:
    - label: ui.homes.btn_sync
      sync: true

scopes:
  root:
    channels:
    - key: general
      label: ui.panels.channels.general
      kind: text
      access: readonly
      description: ui.panels.channels.general_description
    - key: discussions
      label: ui.panels.channels.discussions
      kind: text
      access: public
      description: ui.panels.channels.discussions_description
  bot:
    category: ui.panels.categories.bot
    channels:
    - key: logs
      label: ui.panels.channels.logs
      kind: text
      access: admin
      description: ui.panels.channels.logs_description
    - key: admin
      label: ui.panels.channels.admin
      kind: text
      access: admin
      description: ui.panels.channels.admin_description
    - key: decisions
      label: ui.panels.channels.decisions
      kind: text
      access: admin
      description: ui.panels.channels.decisions_description
  games:
    category: ui.panels.categories.games
    channels:
    - key: general
      label: ui.panels.channels.general
      kind: text
      access: readonly
      description: ui.panels.channels.general_description
    - key: admin
      label: ui.panels.channels.admin
      kind: text
      access: admin
      description: ui.panels.channels.admin_description
    - key: catalog
      label: ui.panels.channels.catalog
      kind: forum
      access: readonly
      description: ui.panels.channels.catalog_description
  games/aoe2:
    category: ui.panels.categories.games_aoe2
    channels:
    - key: general
      label: ui.panels.channels.general
      kind: text
      access: readonly
      description: ui.panels.channels.general_description
    - key: civs
      label: ui.panels.channels.civs
      kind: forum
      access: readonly
      description: ui.panels.channels.civs_description
    - key: maps
      label: ui.panels.channels.maps
      kind: forum
      access: readonly
      description: ui.panels.channels.maps_description
    - key: map-pools
      label: ui.panels.channels.map_pools
      kind: forum
      access: readonly
      description: ui.panels.channels.map_pools_description
    - key: admin
      label: ui.panels.channels.admin
      kind: text
      access: admin
      description: ui.panels.channels.admin_description
  mods:
    category: ui.panels.categories.mods
    channels:
    - key: general
      label: ui.panels.channels.general
      kind: text
      access: readonly
      description: ui.panels.channels.general_description
    - key: admin
      label: ui.panels.channels.admin
      kind: text
      access: admin
      description: ui.panels.channels.admin_description
    - key: catalog
      label: ui.panels.channels.catalog
      kind: forum
      access: readonly
      description: ui.panels.channels.mods_catalog_description
