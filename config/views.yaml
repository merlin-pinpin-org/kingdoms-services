views:
  menu:home:
    kind: menu
    scope: root/general
    buttons:
    - target: panel:profile
      label: ui.homes.btn_profile
      emoji: 👤
    - target: menu:games:home
      label: ui.homes.btn_games
      emoji: 🎮
    - target: menu:mods:home
      label: ui.homes.btn_mods
      emoji: 🧩
    - target: menu:admin
      label: ui.homes.btn_admin
      admin: true
  panel:profile:
    kind: panel
  menu:admin:
    kind: menu
    scope: bot/admin
    buttons:
    - target: ''
      label: ui.homes.btn_language
      action: set-language
      emoji: 🌐
    - target: panel:status
      label: ui.homes.btn_status
      emoji: 📊
    - target: menu:games:admin
      label: ui.homes.btn_games
      emoji: 🎮
    - target: menu:mods:admin
      label: ui.homes.btn_mods
      emoji: 🧩
    - label: ui.homes.btn_sync
      sync: true
    title_emoji: 🔓
    admin_surface: true
  panel:status:
    kind: panel
  menu:games:home:
    kind: menu
    scope: games/general
    buttons:
    - target: menu:games:aoe2
      label: ui.games.homes.aoe2
      emoji: ⚔️
    - target: menu:games:admin
      label: ui.homes.btn_admin
      admin: true
  menu:games:admin:
    kind: menu
    scope: games/admin
    buttons:
    - target: menu:game:aoe2:admin
      label: ui.games.homes.aoe2
      emoji: ⚔️
    - label: ui.homes.btn_sync
      sync: true
    title_emoji: 🔓
    admin_surface: true
  menu:games:aoe2:
    kind: menu
    scope: games/aoe2/general
    buttons:
    - target: panel:game:aoe2:live
      label: ui.homes.btn_live
      emoji: 📡
    - target: panel:game:aoe2:players
      label: ui.homes.btn_users
      emoji: 👥
    - target: menu:game:aoe2:admin
      label: ui.homes.btn_admin
      admin: true
  menu:game:aoe2:admin:
    kind: menu
    scope: games/aoe2/admin
    buttons:
    - label: ui.homes.btn_add_map
      action: import-map
      emoji: 🗺️
    - label: ui.homes.btn_create_pool
      action: create-pool
      emoji: 🧱
    - target: panel:game:aoe2:providers
      label: ui.homes.btn_providers
      emoji: 🔌
    - label: ui.homes.btn_sync
      sync: true
    title_emoji: 🔓
    admin_surface: true
  panel:game:aoe2:live:
    kind: panel
  panel:game:aoe2:players:
    kind: panel
  panel:game:aoe2:providers:
    kind: panel
  menu:mods:home:
    kind: menu
    scope: mods/general
    buttons:
    - target: menu:mod:ladder
      label: ui.mods.homes.ladder
      disabled: true
      emoji: 🏆
    - target: menu:mod:tournament
      label: ui.mods.homes.tournament
      disabled: true
      emoji: 🎯
    - target: menu:mod:kingdom
      label: ui.mods.homes.kingdom
      disabled: true
      emoji: 👑
    - target: menu:mods:admin
      label: ui.homes.btn_admin
      admin: true
  menu:mods:admin:
    kind: menu
    scope: mods/admin
    buttons:
    - target: menu:mod:ladder:admin
      label: ui.mods.homes.ladder
      disabled: true
      emoji: 🏆
    - target: menu:mod:tournament:admin
      label: ui.mods.homes.tournament
      disabled: true
      emoji: 🎯
    - target: menu:mod:kingdom:admin
      label: ui.mods.homes.kingdom
      disabled: true
      emoji: 👑
    - label: ui.homes.btn_sync
      sync: true
    title_emoji: 🔓
    admin_surface: true
  menu:mod:ladder:
    kind: menu
  menu:mod:tournament:
    kind: menu
  menu:mod:kingdom:
    kind: menu
  menu:mod:ladder:admin:
    kind: menu
  menu:mod:tournament:admin:
    kind: menu
  menu:mod:kingdom:admin:
    kind: menu
