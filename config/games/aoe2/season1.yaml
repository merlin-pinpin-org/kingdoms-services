# Season 1 seeding — real JeanJack ladder data (kingdoms-services#205).
# The maps are the 23 maps actually played in season 1 (from the match
# history dump), not a theoretical pool. The ladder ran several pool
# rotations over the season; each pool is a selection into the catalog.
# Idempotent: same ids skip on re-run (seed_aoe2 contract).

game_key: aoe2

maps:
  - name: Arabia
    filename: "arabia"
    description: "The classic open map"
  - name: Fish n Fish
    filename: "fish_n_fish"
    description: "Water-heavy hybrid map"
  - name: Kawasan
    filename: "kawasan"
    description: "Open hybrid with shore fish"
  - name: Hideout
    filename: "hideout"
    description: "Closed defensive map"
  - name: Frozen River
