    description: "Coast-to-inland transition map"
  - name: Baltic
    filename: "baltic"
    description: "Baltic sea straits map"
  - name: Fortified Clearing
    filename: "fortified_clearing"
    description: "Open clearing with fortifiable corners"
  - name: Mudflow
    filename: "mudflow"
    description: "Muddy open lowland"
  - name: Land Nomad
    filename: "land_nomad"
    description: "Nomad start on open land"
  - name: Dunespring
    filename: "dunespring"
    description: "Desert with a central spring"
  - name: Islands
    filename: "islands"
    description: "Archipelago water map"
  - name: Frigid Lake
    filename: "frigid_lake"
    description: "Frozen lake crossing"
  - name: Monocle
    filename: "monocle"
    description: "Ring-shaped land map"
  - name: Dry river
    filename: "dry_river"
    description: "Arid riverbed crossing"
  - name: Immersion
    filename: "immersion"
    description: "Mixed terrain immersion map"
  - name: Big Freeze
    filename: "big_freeze"
    description: "Large frozen tundra"
  - name: African Clearing
    filename: "african_clearing"
    description: "Open map with central woodlines"
  - name: African Reed Beds
    filename: "african_reed_beds"
    description: "Reed wetlands crossing"
  - name: Evacuation
    filename: "evacuation"
    description: "Asymmetric evacuation map"

map_pools:
  - name: "Season 1 — Rotation 1"
    description: "Season 1 opening rotation"
    maps:
      - Fish n Fish
      - Kawasan
      - Hideout
      - Frozen River
      - Sacred Springs
      - Canberra
      - Haboob
  - name: "Season 1 — Rotation 2"
    description: "Season 1 mid-season rotation"
    maps:
      - Fish n Fish
      - Kawasan
      - Hideout
      - Coast to Mountain
      - Baltic
      - Fortified Clearing
      - Arabia
      - Mudflow
  - name: "Season 1 — Rotation 3"
    description: "Season 1 closing rotation"
    maps:
      - Fish n Fish
      - Kawasan
      - Hideout
      - Land Nomad
      - Dunespring
      - Islands
      - Frigid Lake
      - Monocle
      - Dry river
      - Immersion
      - Big Freeze
      - African Clearing
      - African Reed Beds
      - Evacuation

ladders:
  - owner_ref: "guild:default"
    name: "AoE2 Community Ladder"
    map_pool: "Season 1 — Rotation 1"
    season:
      name: "Season 1"
      start_in_days: 0
      duration_days: 180
      reset_ratings: false
